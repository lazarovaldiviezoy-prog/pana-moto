<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcc00">
<meta name="robots" content="noindex">
<title>Viaje en vivo · Pana Moto</title>
<meta name="description" content="Sigue en vivo un viaje de Pana Moto: dónde va la moto y cuánto falta para llegar.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pana Moto">
<meta property="og:title" content="Sigue mi viaje en vivo · Pana Moto">
<meta property="og:description" content="Mira en el mapa dónde voy y cuánto falta para llegar. No necesitas instalar nada.">
<meta property="og:image" content="https://lazarovaldiviezoy-prog.github.io/pana-moto/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon-192.png">
<script>try{var t=JSON.parse(localStorage.getItem("pm_theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--surface-2:#edf1f9;--ink:#0f1b3d;--muted:#56627f;--line:#d9e0ee;--accent:#14316b;--gold:#ffcc00;--gold-ink:#14316b;--red:#e2231a;--good:#15803d;--route:#e2231a;--cta-ink:#ffcc00;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08112a;--surface:#0f1b3d;--surface-2:#172650;--ink:#eef2fb;--muted:#a7b3d1;--line:#243663;--accent:#ffcc00;--gold-ink:#0b1838;--red:#ff5a4f;--good:#22c55e;--route:#ffcc00;--cta-ink:#0b1838;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08112a;--surface:#0f1b3d;--surface-2:#172650;--ink:#eef2fb;--muted:#a7b3d1;--line:#243663;--accent:#ffcc00;--gold-ink:#0b1838;--red:#ff5a4f;--good:#22c55e;--route:#ffcc00;--cta-ink:#0b1838;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:#ffcc00;color:#14316b;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;flex:none}
header img{width:30px;height:30px;border-radius:50%}
header b{font:800 1.25rem "Bricolage Grotesque","Trebuchet MS",sans-serif}
header b i{font-style:normal;background:#14316b;color:#ffcc00;padding:0 6px;border-radius:6px;margin-left:3px}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem;background:#14316b;color:#fff;padding:5px 10px;border-radius:99px;letter-spacing:.04em}
.live i{width:8px;height:8px;border-radius:50%;background:#ff4d42;animation:bl 1.2s infinite}
.live.off i{background:#9aa5c2;animation:none}
@keyframes bl{50%{opacity:.25}}
#map{flex:1;min-height:200px;background:var(--surface-2)}
.dkmap{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.6)}
.card{flex:none;background:var(--surface);border-radius:22px 22px 0 0;margin-top:-20px;position:relative;z-index:500;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:62vh;overflow:auto}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.st.go{color:var(--good)}
h1{font:800 1.35rem/1.2 "Bricolage Grotesque","Trebuchet MS",sans-serif;margin:2px 0 0;text-wrap:balance}
.eta{display:flex;align-items:baseline;gap:8px}
.eta b{font:800 2.1rem/1 "Bricolage Grotesque","Trebuchet MS",sans-serif;color:var(--red)}
.eta span{color:var(--muted);font-weight:600}
.drv{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:10px 12px}
.drv .av{width:50px;height:50px;border-radius:50%;flex:none;object-fit:cover;background:var(--accent);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:1.3rem}
.drv .mo{width:64px;height:50px;border-radius:10px;object-fit:cover;margin-left:auto;flex:none}
.drv strong{display:block}
.drv small{color:var(--muted);font-size:.84rem;display:block;margin-top:2px}
.plate{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--gold);color:var(--gold-ink);padding:2px 7px;border-radius:6px;font-size:.82rem}
.pts{display:grid;gap:8px;font-size:.92rem}
.pts div{display:flex;gap:10px;align-items:flex-start}
.pts i{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.pts small{color:var(--muted);display:block;font-size:.76rem;font-weight:600}
.upd{color:var(--muted);font-size:.8rem}
.warn{background:color-mix(in srgb,var(--gold) 20%,var(--surface));border-radius:12px;padding:9px 12px;font-size:.86rem}
.sos{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sos a{color:var(--red);font-weight:800}
.cta{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--cta-ink);font-weight:800;padding:13px;border-radius:14px;min-height:48px}
.empty{text-align:center;padding:30px 10px 10px;display:grid;gap:10px;justify-items:center}
.empty .big{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:2rem}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.skel i{display:block;height:18px;border-radius:8px;background:var(--surface-2);margin:8px 0;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.5}}
.pt{width:18px;height:18px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk{--b:#ffcc00;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#ffcc00;color:#14316b;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mk .fl{display:grid;transition:transform .4s}
.mk::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid #ffcc00;opacity:0;animation:rg 2s infinite}
@keyframes rg{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.leaflet-tooltip.pinlbl{background:#0f1b3d;color:#fff;border:0;border-radius:8px;padding:3px 8px;font:700 .74rem "Figtree",system-ui,sans-serif}
.leaflet-tooltip.pinlbl::before{border-top-color:#0f1b3d}
@media (min-width:760px){body{flex-direction:row}header{position:fixed;top:0;left:0;right:0;z-index:600}#map{margin-top:52px}.card{width:400px;max-height:none;border-radius:0;margin:52px 0 0;order:-1;align-content:start;padding:22px 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><b>Pana<i>Moto</i></b><span class="live off" id="live"><i></i><span>EN VIVO</span></span></header>
<div id="map" role="img" aria-label="Mapa con la moto en vivo"></div>
<section class="card" id="card" aria-live="polite"><div class="skel"><i style="width:40%"></i><i></i><i style="width:70%"></i></div></section>
<script>
const API_URL = "https://pana-moto-api-production.up.railway.app";
const token = (location.hash.match(/t=([\w-]+)/)||[])[1] || new URLSearchParams(location.search).get("t");
const MOTO_SVG='<svg viewBox="6 4 108 72" width="24" height="16" aria-hidden="true" style="--a:currentColor"><g fill="var(--a)" stroke="var(--a)" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="58" r="13.5" fill="none" stroke-width="5"/><circle cx="26" cy="58" r="7.5" fill="none" stroke-width="1.5"/><circle cx="26" cy="58" r="2.6" stroke="none"/><circle cx="96" cy="58" r="13.5" fill="none" stroke-width="5"/><circle cx="96" cy="58" r="7.5" fill="none" stroke-width="1.5"/><circle cx="96" cy="58" r="2.6" stroke="none"/><path d="M26 51v14M19 58h14M96 51v14M89 58h14" stroke-width="1.1"/><path d="M26 58 L50 53" stroke-width="4" fill="none"/><path d="M84 42 Q96 35.5 108 43" fill="none" stroke-width="2.6"/><path d="M82 25 L96 58" stroke-width="4.6" fill="none"/></g><g fill="var(--a)" stroke="var(--b)" stroke-width="1.6" stroke-linejoin="round"><path d="M60 57 C54 62 46 62 40 57" fill="none" stroke="var(--a)" stroke-width="3.2" stroke-linecap="round"/><rect x="14" y="40" width="24" height="7.5" rx="3.75" transform="rotate(-12 26 43.75)"/><path d="M30 37 H54 L48 47 H36 Z"/><path d="M43 41 H63 L68 48 L64 57 H47 L41 49 Z"/><path d="M10 30.5 L27 32 L27 37 L17 39.5 Z"/><path d="M25 33.5 C33 29 43 29 51 32 L50 37 H27 Z"/><path d="M51 38 C53 28 63 23 77 25 L81 30 L77 38 Z"/><circle cx="87" cy="30" r="5.4"/></g><g fill="none" stroke-linecap="round"><path d="M73 18 L86 22" stroke="var(--a)" stroke-width="3"/><path d="M78 20 L76 12" stroke="var(--a)" stroke-width="1.6"/><ellipse cx="75.6" cy="10.5" rx="3" ry="2" fill="var(--a)"/><path d="M57 31 C63 28 69 27 76 28" stroke="var(--b)" stroke-width="1.6"/><path d="M47 46h15M46 50h16M48 54h12" stroke="var(--b)" stroke-width="1.1"/><circle cx="87" cy="30" r="2.4" fill="var(--b)"/></g></svg>';
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = iso => new Date(iso).toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"});
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : darkMQ.matches;
const COLORS = {Negra:"#1f2937",Blanca:"#f8fafc",Roja:"#dc2626",Azul:"#2563eb",Gris:"#9ca3af",Plateada:"#cbd5e1",Verde:"#16a34a",Amarilla:"#facc15",Naranja:"#f97316",Morada:"#7c3aed",Vinotinto:"#7f1d1d",Marrón:"#78350f"};
let map=null, mk=null, fromMk=null, toMk=null, line=null, lastPos=null, userMoved=false, data=null, timer=null, failures=0, ended=false;

function loadLeaflet(i=0){
  const srcs=["https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/","https://unpkg.com/leaflet@1.9.4/dist/","https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/"];
  return new Promise((ok,fail)=>{
    if(window.L) return ok();
    if(i>=srcs.length) return fail();
    const css=document.createElement("link"); css.rel="stylesheet"; css.href=srcs[i]+"leaflet"+(i===0?".min":"")+".css"; document.head.appendChild(css);
    const s=document.createElement("script"); s.src=srcs[i]+"leaflet"+(i===0?".min":"")+".js";
    s.onload=ok; s.onerror=()=>loadLeaflet(i+1).then(ok,fail); document.head.appendChild(s);
  });
}
function initMap(){
  map=L.map("map",{zoomControl:false}).setView([10.4806,-66.9036],13);
  const tl=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap",className:isDark()?"dkmap":""}).addTo(map);
  let errs=0; tl.on("tileerror",()=>{ if(++errs===6){ map.removeLayer(tl);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:16,attribution:"© Esri",className:isDark()?"dkmap":""}).addTo(map); } });
  map.on("dragstart zoomstart",e=>{ if(e.originalEvent||e.type==="dragstart") userMoved=true; });
  if(data) draw();
}
const pin = c => L.divIcon({className:"",html:`<div class="pt" style="background:${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
function face(dLng,dLat){
  const sp=mk?.getElement()?.querySelector(".fl"); if(!sp||(!dLng&&!dLat)) return;
  const west = dLng ? dLng<0 : sp.dataset.w==="1"; sp.dataset.w=west?"1":"0";
  const a=Math.max(-35,Math.min(35,-Math.atan2(dLat,Math.abs(dLng)||1e-9)*180/Math.PI));
  sp.style.transform=(west?"scaleX(-1) ":"")+`rotate(${a.toFixed(0)}deg)`;
}
function draw(){
  if(!map||!data||!data.from) return;
  const d=data, ongoing=d.status==="ongoing", done=d.status==="completed";
  const lbl=(m,t)=>m.bindTooltip(t,{permanent:true,direction:"top",offset:[0,-10],className:"pinlbl"});
  if(!fromMk){ fromMk=L.marker([d.from.lat,d.from.lng],{icon:pin("#16804a")}).addTo(map); lbl(fromMk,"Recogida"); }
  if(!toMk){ toMk=L.marker([d.to.lat,d.to.lng],{icon:pin("#e2231a")}).addTo(map); lbl(toMk,d.svc==="encomienda"?"Entrega":"Destino"); }
  const loc=d.driver_loc, pts=[[d.from.lat,d.from.lng],[d.to.lat,d.to.lng]];
  if(loc && !done){
    const p=[loc.lat,loc.lng];
    if(!mk) mk=L.marker(p,{icon:L.divIcon({className:"",html:`<div class="mk"><span class="fl">${MOTO_SVG}</span></div>`,iconSize:[40,40],iconAnchor:[20,20]}),zIndexOffset:1000}).addTo(map);
    else { if(lastPos) face(p[1]-lastPos[1],p[0]-lastPos[0]); slide(mk.getLatLng(),p); }
    lastPos=p;
    const goal = ongoing ? [d.to.lat,d.to.lng] : [d.from.lat,d.from.lng];
    const col=getComputedStyle(document.documentElement).getPropertyValue("--route").trim();
    if(line) line.setLatLngs([p,goal]); else line=L.polyline([p,goal],{color:col,weight:4,dashArray:"6 8",opacity:.9}).addTo(map);
    pts.push(p);
  } else { if(mk){ mk.remove(); mk=null; } if(line){ line.remove(); line=null; } }
  if(!userMoved) map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[50,60],paddingBottomRight:[50,80],maxZoom:17});
}
function slide(from,to){ // movimiento suave entre una ubicación y la siguiente
  const t0=performance.now(), a=[from.lat,from.lng], dur=1200;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur); mk&&mk.setLatLng([a[0]+(to[0]-a[0])*k, a[1]+(to[1]-a[1])*k]); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function ago(iso){ const s=Math.max(0,Math.round((Date.now()-Date.parse(iso))/1000)); return s<60?`hace ${s} s`:`hace ${Math.round(s/60)} min`; }
function view(){
  const d=data, enc=d.svc==="encomienda", who=esc(d.passenger), dr=d.driver, n=esc(dr?.first||"El motorizado");
  const live=$("#live");
  const endBox=(icon,title,txt)=>`<div class="empty"><div class="big">${icon}</div><h1>${title}</h1><p>${txt}</p></div><a class="cta" href="./">Abrir Pana Moto</a>`;
  if(d.status==="cancelled"||d.status==="expired"){ live.classList.add("off"); return endBox("✕", enc?"Encomienda cancelada":"Viaje cancelado","Este viaje se canceló, así que ya no hay ubicación para mostrar."); }
  if(d.status==="ended"){ live.classList.add("off"); return endBox("✓", enc?"Encomienda entregada":"Viaje terminado","Este viaje ya terminó y la ubicación ya no se comparte."); }
  let st, title, eta="";
  if(d.status==="searching"){ st="Buscando moto"; title=enc?`${who} está buscando una moto para su encomienda`:`${who} está buscando una moto`; }
  else if(d.status==="accepted"){ st="Moto en camino"; title=enc?`${n} va a recoger la encomienda de ${who}`:`${n} va a buscar a ${who}`;
    if(d.eta_min!=null) eta=`<div class="eta"><b>${d.eta_min} min</b><span>para llegar a la recogida</span></div>`; }
  else if(d.status==="arrived"){ st="En el punto de recogida"; title=enc?`${n} llegó a recoger la encomienda`:`${n} llegó a buscar a ${who}`; }
  else if(d.status==="ongoing"){ st="En viaje"; title=enc?`La encomienda va en camino a ${esc(d.to.name)}`:`${who} va en camino a ${esc(d.to.name)}`;
    if(d.eta_min!=null) eta=`<div class="eta"><b>${d.eta_min} min</b><span>para llegar · aprox. ${hhmm(Date.now()+d.eta_min*60000)}</span></div>`; }
  else if(d.status==="completed"){ st="Llegó"; title=enc?`Encomienda entregada en ${esc(d.to.name)}`:`${who} llegó a ${esc(d.to.name)}`;
    eta=`<div class="eta"><b style="color:var(--good)">✓ ${hhmm(d.completed_at)}</b><span>hora de llegada</span></div>`; }
  live.classList.toggle("off", !["accepted","arrived","ongoing"].includes(d.status));
  const loc=d.driver_loc, stale = loc && (Date.now()-Date.parse(loc.updated_at))/1000>120 && d.status!=="completed";
  const col=dr?.moto_color, dot=col&&COLORS[col]?`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${COLORS[col]};border:1px solid var(--line);vertical-align:-1px"></span> `:"";
  const img=u=>u?(u.startsWith("http")?u:API_URL+u):null;
  return `<div><span class="st ${["accepted","ongoing"].includes(d.status)?"go":""}">${st}</span><h1>${title}</h1></div>
  ${eta}
  ${stale?`<div class="warn">La última ubicación se recibió ${ago(loc.updated_at)}. Puede ser falta de señal; se actualiza sola.</div>`:""}
  ${dr?`<div class="drv">${img(dr.photo_url)?`<img class="av" src="${img(dr.photo_url)}" alt="">`:`<div class="av">${n[0]}</div>`}
    <div><strong>${n} · ★ ${dr.rating}</strong><small>${esc(dr.model)}${col?` · ${dot}${esc(col)}`:""}</small><small>Placa <span class="plate">${esc(dr.plate)}</span></small></div>
    ${img(dr.moto_url)?`<img class="mo" src="${img(dr.moto_url)}" alt="Foto de la moto">`:""}</div>`:""}
  <div class="pts"><div><i style="background:#16804a"></i><span><small>Recogida</small>${esc(d.from.name)}</span></div>
    <div><i style="background:#e2231a"></i><span><small>${enc?"Entrega":"Destino"}</small>${esc(d.to.name)}</span></div></div>
  <div class="upd" id="upd">${loc?"Ubicación actualizada "+ago(loc.updated_at):"Se actualiza sola cada pocos segundos"}</div>
  <div class="sos">¿Crees que hay una emergencia? Llama al <a href="tel:911">911</a>.</div>
  <a class="cta" href="./">¿Necesitas una moto? Abre Pana Moto</a>`;
}
async function poll(){
  clearTimeout(timer);
  if(!token){ $("#card").innerHTML=`<div class="empty"><div class="big">?</div><h1>Link incompleto</h1><p>Pide que te vuelvan a enviar el link del viaje.</p></div>`; return; }
  try{
    const r=await fetch(`${API_URL}/track/${encodeURIComponent(token)}`,{cache:"no-store"});
    if(r.status===404){ $("#live").classList.add("off"); $("#card").innerHTML=`<div class="empty"><div class="big">?</div><h1>Este link no existe</h1><p>Revisa que esté completo o pide que te lo envíen otra vez.</p></div><a class="cta" href="./">Abrir Pana Moto</a>`; return; }
    data=await r.json(); failures=0;
    $("#card").innerHTML=view(); draw();
    ended = ["completed","cancelled","expired","ended"].includes(data.status);
  }catch(e){
    failures++;
    if(!data) $("#card").innerHTML=`<div class="empty"><div class="big">!</div><h1>Sin conexión</h1><p>Reintentando…</p></div>`;
  }
  if(!ended) timer=setTimeout(poll, document.hidden?15000:Math.min(4000*(1+failures),20000));
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !ended) poll(); });
setInterval(()=>{ const u=$("#upd"); if(u&&data?.driver_loc&&!ended) u.textContent="Ubicación actualizada "+ago(data.driver_loc.updated_at); },1000);
poll();
loadLeaflet().then(initMap).catch(()=>{ $("#map").innerHTML='<p style="padding:20px;text-align:center;color:var(--muted)">No se pudo cargar el mapa con esta conexión. Los datos del viaje se siguen actualizando abajo.</p>'; });
</script>
</body>
</html>
