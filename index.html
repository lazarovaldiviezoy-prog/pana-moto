<script>try{var t=JSON.parse(localStorage.getItem("pm_theme"));if(t==="light"||t==="dark"){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0f1b3d":"#ffcc00";}}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Tricolor pana: amarillo, azul y rojo */
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#edf1f9; --ink:#0f1b3d; --muted:#56627f; --line:#d9e0ee;
  --accent:#14316b; --accent-ink:#ffcc00; --gold:#ffcc00; --gold-ink:#14316b; --top:#ffcc00; --top-ink:#14316b;
  --red:#e2231a; --route:#e2231a; --blue:#14316b; --good:#15803d; --bad:#e2231a; --pink:#c0267a; --link:#14316b;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
/* Modo oscuro: automático según el celular, o elegido en el menú (data-theme) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08112a; --surface:#0f1b3d; --surface-2:#172650; --ink:#eef2fb; --muted:#a7b3d1; --line:#243663;
  --accent:#ffcc00; --accent-ink:#0b1838; --gold:#ffcc00; --gold-ink:#0b1838; --top:#0f1b3d; --top-ink:#ffcc00;
  --red:#ff5a4f; --route:#ffcc00; --blue:#ffcc00; --good:#4cc887; --bad:#ff6b61; --pink:#ff7ab8; --link:#ffcc00; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08112a; --surface:#0f1b3d; --surface-2:#172650; --ink:#eef2fb; --muted:#a7b3d1; --line:#243663;
  --accent:#ffcc00; --accent-ink:#0b1838; --gold:#ffcc00; --gold-ink:#0b1838; --top:#0f1b3d; --top-ink:#ffcc00;
  --red:#ff5a4f; --route:#ffcc00; --blue:#ffcc00; --good:#4cc887; --bad:#ff6b61; --pink:#ff7ab8; --link:#ffcc00; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--top);color:var(--top-ink);z-index:1001;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;white-space:nowrap}
.brand{display:flex;align-items:center;gap:6px}
.brand .logo{width:26px;height:26px;border-radius:7px;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.brand i{font-style:normal;background:var(--top-ink);color:var(--top);padding:0 6px;border-radius:6px;margin-left:2px}
.modes{display:flex;background:color-mix(in srgb,var(--top-ink) 12%,transparent);border-radius:999px;padding:3px}
.modes button{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:600;color:color-mix(in srgb,var(--top-ink) 78%,transparent)}
.modes button[aria-pressed="true"]{background:var(--top-ink);color:var(--top)}
.offline{background:var(--bad);color:#fff;text-align:center;font-size:.82rem;font-weight:600;padding:6px 12px;z-index:1001}

.mapwrap{position:relative;flex:1 1 auto;min-height:120px}
#map{position:absolute;inset:0;background:var(--surface-2)}
.leaflet-container{background:var(--surface-2)!important}
.dkmap{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.75)}
.leaflet-container img.leaflet-tile{mix-blend-mode:normal!important;width:256.6px!important;height:256.6px!important}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-weight:600;z-index:400;pointer-events:none}
.fab{position:absolute;right:12px;z-index:500;height:46px;border-radius:23px;border:0;background:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.25);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:6px}
.locbtn{bottom:34px;width:46px;font-size:1.3rem}
.stylebtn{bottom:90px;padding:0 12px}
.centerpin{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
.centerpin .head{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:transform .15s}
.centerpin .stick{width:3px;height:14px;background:var(--ink);margin-top:-2px}
.centerpin.lift .head{transform:rotate(-45deg) translate(4px,-4px)}

.sheet{background:var(--surface);border-radius:22px 22px 0 0;margin-top:-22px;position:relative;z-index:1000;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 24px -12px rgba(0,0,0,.3);max-height:62vh;overflow-y:auto;transition:height .25s ease}
.sheet.dragging{transition:none}
.sheet > *{flex-shrink:0}
.grab{align-self:stretch;height:24px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none;margin-bottom:-6px}
.grab::before{content:"";width:44px;height:5px;border-radius:9px;background:var(--line)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.01em}
.field{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;border:0;text-align:left;width:100%}
.field .txt{min-width:0}
.field .txt small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.field .txt span{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .txt span.empty{color:var(--muted);font-weight:500}
.field .go{font-size:.78rem;font-weight:700;color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%}
.dot.a{background:var(--good)} .dot.b{background:var(--bad)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-top:-4px}
.quick .chip{white-space:nowrap;font-size:.8rem;padding:6px 10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.svc{flex:1 1 0;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.svc[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.svc strong{font-size:.95rem} .svc span{font-size:.78rem;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left}
.toggle span small{display:block;color:var(--muted);font-size:.76rem;font-weight:500}
.toggle span{font-weight:700;font-size:.92rem}
.toggle i{flex:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"]{border-color:var(--pink)}
.toggle[aria-pressed="true"] i{background:var(--pink)}
.toggle[aria-pressed="true"] i::after{left:21px}
.toggle.green[aria-pressed="true"]{border-color:var(--good)}
.toggle.green[aria-pressed="true"] i{background:var(--good)}
.inp{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.price{display:flex;align-items:center;gap:8px}
.cur{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.cur button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-weight:700;font-size:.85rem;color:var(--muted)}
.cur button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:4px}
.stepper button{width:40px;height:40px;border:0;border-radius:10px;background:var(--surface);font-size:1.2rem;font-weight:700}
.stepper output{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stepper.sm{flex:0 0 150px} .stepper.sm button{width:34px;height:34px} .stepper.sm output{font-size:1.05rem}
.mix{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px;font-weight:600;font-size:.88rem}
.mix .stepper{background:var(--surface)} .mix .stepper button{background:var(--surface-2)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.hint b{color:var(--ink)}
.cta{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.02rem;padding:14px;border-radius:14px;width:100%}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1.5px solid var(--line);background:var(--surface);font-weight:700;padding:11px;border-radius:12px;width:100%;text-decoration:none;text-align:center;display:block}
.install{border:0;background:var(--gold);color:var(--gold-ink);font-weight:700;padding:10px;border-radius:12px;width:100%}
.panic{border:0;background:var(--bad);color:#fff;font-weight:800;padding:13px;border-radius:12px;width:100%}
.panel{border:2px solid var(--bad);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel strong{color:var(--bad)}
.search{display:flex;gap:8px}
.results{display:flex;flex-direction:column;gap:2px}
.results button{border:0;background:transparent;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.results button strong{font-size:.92rem}
.results button span{font-size:.78rem;color:var(--muted)}
.rate{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.rate input{width:80px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}

.offer{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;animation:pop .35s ease}
.offer.fav{border-color:var(--pink)}
@keyframes pop{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.offer .who{min-width:0} .offer .who strong{display:block;font-size:.95rem} .offer .who span{font-size:.78rem;color:var(--muted)}
.offer .amt{text-align:right}
.offer .amt strong{display:block;font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.offer .amt span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:3px}
.tag.same{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tag.up{background:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--ink)}
.tag.pk{background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.offer .acts{grid-column:1/-1;display:flex;gap:8px}
.offer .acts button{flex:1;padding:9px;border-radius:10px;font-weight:700;border:0}
.acc{background:var(--good);color:#fff} .rej{background:var(--surface-2)}
.searching{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.8);opacity:.4}}
.driver{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.driver .av{width:52px;height:52px}
.plate{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--gold);color:var(--gold-ink);padding:4px 8px;border-radius:6px;font-size:.85rem}
.status{font-weight:700;font-size:1rem}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.sum span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{border:0;background:none;font-size:1.9rem;color:var(--line);padding:0}
.stars button.on{color:var(--gold)}
.note{font-size:.8rem;background:var(--surface-2);border-radius:10px;padding:8px 10px;color:var(--muted);line-height:1.45}
.proof{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.proof .ph{border-radius:10px;overflow:hidden;aspect-ratio:1;max-width:100%}
.proof .ph svg{display:block;width:100%;height:100%}
.proof div{display:flex;flex-direction:column;gap:2px;min-width:0}
.proof span{font-size:.8rem;color:var(--muted)}
.req{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.req .route{font-size:.88rem;line-height:1.4}
.req .amt{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.req .ctr{display:flex;gap:6px}
.req .ctr button{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.82rem}
.req .ctr button.acc{background:var(--good);color:#fff;border-color:var(--good)}
.earn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.earn div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.earn small{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.earn b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:2000}

.leaflet-marker-icon.mv{transition:transform 1s linear}
.nomv .leaflet-marker-icon.mv{transition:none!important}
.mk{--b:#14316b;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#14316b;color:#ffcc00;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.f{background:var(--pink);color:#fff;--b:var(--pink)}
.mk.trip{--b:#ffcc00;background:#ffcc00;color:#14316b;width:38px;height:38px}
.mk .fl{display:grid;transition:transform .3s}
.me{width:18px;height:18px;border-radius:50%;background:#2f6bff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,107,255,.2)}
.pt{width:18px;height:18px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.menu{border:0;background:color-mix(in srgb,var(--top-ink) 12%,transparent);color:var(--top-ink);width:34px;height:34px;border-radius:10px;font-size:1.1rem;display:grid;place-items:center;flex:none}
.ovhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:.95rem;flex:none}
.x.sm{width:28px;height:28px;font-size:.8rem}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;text-align:left;align-self:flex-start}
.link,.field .go{color:var(--link)}
.demo{margin:0;font-size:.82rem;background:color-mix(in srgb,var(--gold) 25%,var(--surface));border-radius:8px;padding:6px 10px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.list{display:flex;flex-direction:column}
.list button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 4px;font-weight:600;text-align:left}
.list button span{color:var(--muted);font-weight:500;font-size:.85rem}
.wiz{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.wiz li{flex:1;min-width:0;font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:6px;border-top:4px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz li.ok{border-color:var(--gold)} .wiz li.on{border-color:var(--accent);color:var(--ink)}
.inp.code{font-size:1.6rem;letter-spacing:.5em;text-align:center;font-family:var(--display)}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.doc.ok{border-style:solid;border-color:var(--good)}
.doc:focus-within{outline:3px solid var(--gold)}
.doc .th{width:44px;height:44px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-size:1.2rem}
.doc .th img{width:100%;height:100%;object-fit:cover}
.doc > span:nth-child(2){min-width:0}
.doc b{display:block;font-size:.9rem} .doc small{display:block;color:var(--muted);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .st{font-weight:700;font-size:.8rem;color:var(--accent)} .doc.ok .st{color:var(--good)}
.plans{display:flex;flex-direction:column;gap:8px}
.plan{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.plan[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.plan small{color:var(--muted);font-size:.8rem;line-height:1.4}
.promo{background:color-mix(in srgb,var(--gold) 25%,var(--surface));border-radius:12px;padding:10px 12px;font-size:.85rem;line-height:1.45}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.84rem}
.checks div{display:flex;gap:6px;align-items:center} .checks span{color:var(--good);font-weight:800}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#14316b;color:#fff;border-radius:16px;padding:14px}
.wallet > div:first-child{min-width:0}
.wallet small{display:block;font-size:.7rem;opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wallet b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.wallet span{font-size:.8rem;opacity:.92}
.wallet .wbtn{display:flex;flex-direction:column;gap:6px;flex:none}
.wallet .wbtn .cta{background:var(--gold);color:var(--gold-ink);padding:9px 14px;font-size:.88rem}
.wallet .wbtn .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);padding:8px 14px;font-size:.85rem}
.wallet.low{outline:3px solid var(--bad)}
.alert{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad);border-radius:10px;padding:8px 10px;font-weight:700;font-size:.85rem}
.chart{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ch-head{display:flex;justify-content:space-between;align-items:baseline}
.ch-head b{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:110px;align-items:end}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b span{width:100%;max-width:26px;background:color-mix(in srgb,var(--accent) 40%,var(--surface-2));border-radius:6px 6px 2px 2px}
.bars .b.t span{background:var(--gold)}
.bars small{font-size:.68rem;color:var(--muted);font-weight:700}
.hist{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.hist .top{display:flex;justify-content:space-between;gap:8px} .hist .top strong{font-size:.9rem;min-width:0}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:.88rem}
.hrow small{display:block;color:var(--muted);font-size:.75rem}
.codebox{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;border:2px dashed var(--gold);border-radius:14px;padding:12px}
.codebox small{grid-column:1/-1;color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.codebox b{font-family:var(--display);font-size:1.5rem;letter-spacing:.04em}
.codebox .ghost{width:auto;padding:8px 14px}
.mopic{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.mopic .mp{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.mopic small{display:block;color:var(--muted);font-size:.8rem}
.review{border-bottom:1px solid var(--line);padding:6px 0;font-size:.86rem;line-height:1.4}
.review span{color:var(--gold);margin-right:6px;font-size:.8rem}
.dot.c{background:#e8891a}
.when{align-items:center} .when .inp{flex:1;padding:7px 10px;min-width:0}
.dtip{background:transparent!important;border:0!important;box-shadow:none!important;color:#fff!important;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:.75rem}
.dtip::before{display:none}
button.av{border:0;cursor:pointer;flex:none}
.modes button{padding:6px 9px}
.adocs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.adocs button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.adocs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block}
.adocs .pulse{margin:18px 0}
.adocs small{font-size:.66rem;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bigdoc{display:flex;flex-direction:column;gap:8px}
.bigdoc img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--surface-2)}
.chat{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.msg{align-self:flex-start;max-width:80%;background:var(--surface-2);border-radius:14px 14px 14px 4px;padding:7px 10px;font-size:.9rem;line-height:1.35;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}
.msg small{display:block;font-size:.66rem;opacity:.7;margin-top:2px;text-align:right}
.route{font-size:.88rem;line-height:1.5}
.reqpin{background:#14316b;color:#ffcc00;font-weight:800;font-size:.78rem;padding:4px 8px;border-radius:12px;border:2px solid #e2231a;box-shadow:0 2px 6px rgba(0,0,0,.35);text-align:center;white-space:nowrap}
.pushcard{display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--gold) 22%,var(--surface));border:1.5px solid var(--gold);border-radius:14px;padding:12px}
.pushcard b{font-size:.95rem} .pushcard span{font-size:.84rem;color:var(--muted);line-height:1.4} .pushcard .cta{padding:10px;font-size:.92rem}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.82rem;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs button i{font-style:normal;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:0 6px;margin-left:2px;font-size:.72rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kpis div{background:var(--surface-2);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis small{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpis b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
textarea.inp{resize:vertical;min-height:70px;line-height:1.4}
.trow{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.trow > span{min-width:0}
.av{overflow:hidden}
.av img,.bigav img{width:100%;height:100%;object-fit:cover;display:block}
.photobtns{grid-column:1/-1;display:flex;gap:6px}
.photobtns label{flex:1;padding:9px 6px;font-size:.86rem;cursor:pointer;border-radius:10px}
.photobtns label:active{transform:scale(.98)}
.colorchip{display:inline-flex;align-items:center;gap:6px}
.colorchip i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.mopic .mp{background:#14316b;color:#ffcc00;overflow:hidden}
.mopic .mp img{width:100%;height:100%;object-fit:cover;display:block}
.mopic small{display:block}
.mopic small .plate{font-size:.8rem;padding:1px 6px}
.profbox{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}
.profbox small{display:block;color:var(--muted);font-size:.82rem}
.bigav{width:76px;height:76px;border-radius:50%;background:#14316b;color:#ffcc00;display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;overflow:hidden;flex:none}
.themepick{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px;font-weight:600}
.themepick .cur{background:var(--surface)}
.themepick .cur button{font-size:.8rem;padding:6px 9px}
.themepick .cur button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Pulido ===== */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.icw{display:inline}
h2 .ic{width:1em;height:1em;vertical-align:-.1em;color:var(--red)}
.sdot{display:inline-block;width:.62em;height:.62em;border-radius:50%;border:2px solid var(--muted);vertical-align:.05em;margin-right:2px}
.sdot.on{background:var(--good);border-color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.menu .ic,.locbtn .ic{width:22px;height:22px;vertical-align:middle}
.stylebtn .ic{width:18px;height:18px;vertical-align:-4px;margin-right:2px}
/* accesibilidad: botones cómodos para el dedo */
.cta{min-height:50px}.ghost{min-height:46px}.chip{min-height:40px}
.link{min-height:40px}.menu,.fab{min-width:44px;min-height:44px}
.stars button{min-width:44px;min-height:44px}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* esqueletos de carga */
.skel{display:grid;gap:10px;padding:6px 0}
.skel i{display:block;height:54px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in srgb,var(--surface-2) 55%,var(--surface)) 50%,var(--surface-2) 75%);background-size:300% 100%;animation:shim 1.3s linear infinite}
.skel i:nth-child(1){height:20px;width:45%;border-radius:8px}
.skel i:nth-child(3){width:80%}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
/* mapa */
.route-anim{animation:rdash .9s linear infinite}
@keyframes rdash{to{stroke-dashoffset:-16}}
.leaflet-tooltip.pinlbl{background:var(--ink);color:var(--surface);border:0;border-radius:8px;padding:3px 8px;font:700 .74rem "Figtree",system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.leaflet-tooltip.pinlbl::before{border-top-color:var(--ink)}
.pt{transition:transform .2s}
/* motorizado: interruptor grande y estadísticas plegables */
#online{padding:16px;border-width:2px;border-radius:18px}
#online>span{font-size:1.08rem}
#online i{width:58px;height:34px}
#online i::after{width:28px;height:28px}
#online[aria-pressed="true"] i::after{left:27px}
#online[aria-pressed="true"]{background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.statsbtn{display:flex;align-items:center;justify-content:space-between;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:48px;font-weight:600;font-size:.92rem}
.statsbtn .ic{transition:transform .2s;color:var(--muted)}
.statsbtn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.stx-closed~.dashrow,.stx-closed~.earn,.stx-closed~.chart{display:none!important}
/* pantalla final */
.okcheck{position:relative;width:76px;height:76px;margin:4px auto 2px}
.okcheck svg{width:76px;height:76px;display:block}
.okcheck circle{fill:var(--good);stroke:none}
.okcheck path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:0}
.okcheck i{position:absolute;left:50%;top:50%;width:8px;height:12px;border-radius:2px;opacity:0;background:var(--c)}
.done-h{text-align:center}
.stars button{font-size:2.5rem;transition:transform .15s,color .15s}
.stars button.on{transform:scale(1.06)}
.stars button:active{transform:scale(.9)}
/* bienvenida y pantalla de carga */
#splash{position:fixed;inset:0;z-index:9999;background:#14316b;display:grid;place-content:center;justify-items:center;gap:16px;color:#fff;transition:opacity .35s;animation:splout .35s 5s forwards}
#splash img{width:120px;height:120px;border-radius:50%;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:splpop .6s cubic-bezier(.2,1.4,.4,1) both}
#splash b{font:800 2.1rem "Bricolage Grotesque","Trebuchet MS",sans-serif;letter-spacing:-.5px}
#splash b i{font-style:normal;color:#ffcc00}
#splash .bar{width:120px;height:4px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
#splash .bar::after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,#ffcc00,#e2231a);border-radius:9px;animation:splbar 1s ease-in-out infinite}
#splash.out{opacity:0;pointer-events:none}
@keyframes splout{to{opacity:0;visibility:hidden}}
@keyframes splpop{from{transform:scale(.6);opacity:0}}
@keyframes splbar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#onb{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#onb .skip{align-self:flex-end;margin:12px 14px 0;border:0;background:none;color:var(--muted);font-weight:700;font-size:.95rem;min-height:44px;padding:0 12px}
#onb .slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#onb .slides::-webkit-scrollbar{display:none}
#onb .sl{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;gap:14px}
#onb .art{width:min(62vw,240px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--c1);margin-bottom:14px}
#onb .art::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:6px solid var(--c2);opacity:.9}
#onb .art .ic{width:46%;height:46%;color:var(--c3);stroke-width:1.6}
#onb .art em{position:absolute;z-index:1;right:2%;bottom:6%;background:var(--red);color:#fff;font:800 1.1rem "Figtree",sans-serif;font-style:normal;padding:6px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#onb h2{font:800 1.9rem "Bricolage Grotesque","Trebuchet MS",sans-serif;margin:0;color:var(--ink);text-wrap:balance}
#onb p{margin:0;color:var(--muted);font-size:1.02rem;line-height:1.5;max-width:30ch}
#onb .foot{padding:16px 22px 22px;display:grid;gap:14px}
#onb .dots{display:flex;gap:8px;justify-content:center}
#onb .dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:all .25s}
#onb .dots i.on{width:26px;background:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .sheet.enter>*{animation:rise .36s cubic-bezier(.2,.8,.2,1) both}
  .sheet.enter>*:nth-child(3){animation-delay:.04s}.sheet.enter>*:nth-child(4){animation-delay:.08s}
  .sheet.enter>*:nth-child(5){animation-delay:.12s}.sheet.enter>*:nth-child(n+6){animation-delay:.16s}
  .offer.new{animation:offin .45s cubic-bezier(.2,1.2,.4,1) both}
  .sheet.enter .okcheck svg{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
  .sheet.enter .okcheck path{animation:draw .45s .25s ease-out both}
  .sheet.enter .okcheck i{animation:burst .9s .2s cubic-bezier(.1,.7,.3,1) both}
  #onb .sl.on .art{animation:splpop .5s cubic-bezier(.2,1.4,.4,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes offin{from{opacity:0;transform:translateX(40px) scale(.96)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{from{stroke-dashoffset:40}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}

/* ===== Apariencia 2: inicio limpio, precio, ofertas, viaje, chat y Navidad ===== */
.bigsearch{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface-2);border:2px solid var(--accent);border-radius:16px;padding:14px;font-size:1.02rem;color:var(--muted);font-weight:600;text-align:left;min-height:56px}
.bigsearch>.icw .ic,.bigsearch>.ic{color:var(--accent);width:22px;height:22px}
.bigsearch .mapchip{margin-left:auto;font-size:.78rem;color:var(--accent);font-weight:700;background:var(--surface);padding:6px 10px;border-radius:99px;white-space:nowrap}
.fromline{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:2px 2px;text-align:left;font-size:.86rem;color:var(--muted);min-height:36px}
.fromline b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.fromline .go{color:var(--link);font-weight:700;font-size:.8rem}
.fromline .dot{flex:none}
.places{display:grid}
.places button{display:flex;gap:12px;align-items:center;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:56px;color:var(--ink)}
.places button:last-child{border-bottom:0}
.places .pi{width:38px;height:38px;border-radius:50%;background:var(--surface-2);color:var(--accent);display:grid;place-items:center;flex:none}
.places .pi .ic{width:19px;height:19px}
.places b{display:block;font-size:.95rem}
.places small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.places span:last-child{min-width:0}
.places .add b{color:var(--link)}
.bigprice{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:6px}
.bigprice .pm{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.9rem;font-weight:500;color:var(--accent);display:grid;place-items:center;padding:0}
.bigprice .pm:active{transform:scale(.92)}
.bigprice .pv{text-align:center}
.bigprice output{display:block;font:800 3rem/1.05 var(--display);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.bigprice small{color:var(--muted);font-size:.84rem;font-weight:600}
.pricehead{display:flex;justify-content:space-between;align-items:center}
.rec{display:flex;gap:6px;align-items:center;justify-content:center;border-radius:12px;padding:8px 10px;font-weight:700;font-size:.82rem;text-align:center}
.rec.ok{background:color-mix(in srgb,var(--good) 13%,var(--surface));color:var(--good)}
.rec.low{background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:var(--ink)}
.qprice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qprice button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;min-height:44px;font-variant-numeric:tabular-nums}
.qprice button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.svc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.svc[aria-pressed="true"] span{color:inherit;opacity:.8}
.offer{position:relative;overflow:hidden}
.otag{position:absolute;top:0;right:0;color:#fff;font-size:.66rem;font-weight:800;padding:4px 10px;border-radius:0 0 0 12px;text-transform:uppercase;letter-spacing:.03em;z-index:1}
.otag.cheap{background:#15803d}.otag.fast{background:#2563eb}.otag.best{background:#b45309}
.offer .amt{padding-top:10px}
.tbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--surface-2)}
.tbar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--red),var(--gold));animation:tbar var(--t) linear forwards}
@keyframes tbar{from{width:var(--w)}to{width:0}}
.etachip{position:absolute;left:12px;top:12px;z-index:600;background:var(--ink);color:var(--surface);font-weight:700;font-size:.8rem;padding:8px 12px;border-radius:99px;display:flex;gap:6px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.etachip .ic{width:15px;height:15px}
.centerpin::after{content:"";width:12px;height:5px;border-radius:50%;background:rgba(0,0,0,.35);margin-top:-1px;transition:transform .15s,opacity .15s}
.centerpin .head,.centerpin .stick{transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.centerpin.lift .head{transform:rotate(-45deg) translate(9px,-9px)}
.centerpin.lift .stick{transform:translateY(-12px)}
.centerpin.lift::after{transform:scale(1.6);opacity:.5}
.chat .msgs{background:color-mix(in srgb,#e7dccd 70%,var(--surface));border-radius:12px;padding:10px;max-height:240px}
:root[data-theme="dark"] .chat .msgs{background:#0b1430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chat .msgs{background:#0b1430}}
.chat .msg{background:var(--surface);box-shadow:0 1px 1px rgba(0,0,0,.08);border-radius:4px 14px 14px 14px;color:var(--ink)}
.chat .msg.mine{background:#fff1b8;color:#0f1b3d;border-radius:14px 4px 14px 14px}
:root[data-theme="dark"] .chat .msg.mine{background:#3a3410;color:#fff6cc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chat .msg.mine{background:#3a3410;color:#fff6cc}}
.chat .msg small{display:block;text-align:right;font-size:.66rem;opacity:.65;margin-top:2px}
.chat .msg.mine small::after{content:" ✓";font-weight:800}
.chat .quick .chip{border-color:var(--accent);color:var(--accent);background:var(--surface);min-height:38px}
.chat .search{display:flex;gap:8px;align-items:center}
.chat .search .inp{border-radius:99px}
.chat #chatSend{width:46px!important;height:46px;min-height:46px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border:0;flex:none}
.pushcard:has(#pushOn){display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:2px;align-items:center;padding:10px 12px}
.pushcard:has(#pushOn) b{grid-column:1}
.pushcard:has(#pushOn) span{grid-column:1;font-size:.78rem;line-height:1.3}
.pushcard #pushOn{grid-column:2;grid-row:1/3;width:auto;min-height:44px;padding:8px 14px;font-size:.86rem}
/* Navidad */

<body>
<div id="splash" aria-hidden="true"><img src="icon-512.png" alt="" width="120" height="120"><b>Pana<i>Moto</i></b><span class="bar"></span></div>
<div class="topbar">
  <div class="row nw" style="align-items:center;gap:8px"><button class="menu" id="menuBtn" aria-label="Menú"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="brand"><img src="icon-192.png" alt="" width="26" height="26" class="logo">Pana<i>Moto</i></div></div>

  <button class="fab locbtn" id="locbtn" aria-label="Ir a mi ubicación"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"/><path d="M12 2l0 2"/><path d="M12 20l0 2"/><path d="M20 12l2 0"/><path d="M2 12l2 0"/></svg></button>
</div>

<script>
/* ================= Configuración ================= */
const CARACAS = {lat:10.4917, lng:-66.8540, name:"Chacaíto, Caracas"};
let RATE = 220;          // Bs por $ (ejemplo; en producción viene del BCV)
const COM = 0.10;        // comisión de la app al motorizado
const MIX = "Mixto $ + Bs";
const PAY = ["Efectivo $","Pago Móvil","Zelle","Binance USDT",MIX];
const DRIVERS = [
  {n:"Luis R.",    g:"m", c:"#1d3a8a", moto:"Bera SBR 150",        r:4.9, v:812,  plate:"AB1C23D"},
  {n:"Yorman P.",  g:"m", c:"#b4532a", moto:"Empire Keeway Horse", r:4.8, v:530,  plate:"AE7K91M"},
  {n:"Carlos M.",  g:"m", c:"#16804a", moto:"Suzuki GN125",        r:4.7, v:1204, plate:"AC4M55P"},
  {n:"Daniela G.", g:"f", c:"#7a3fa0", moto:"Bera Cobra 200",      r:5.0, v:318,  plate:"AD2B08R"},
  {n:"Yusmary C.", g:"f", c:"#c2410c", moto:"Empire Owen 150",     r:4.9, v:441,  plate:"AF3T67K"},
  {n:"María J.",   g:"f", c:"#0f766e", moto:"Bera BR 150",         r:4.8, v:276,  plate:"AG9P14S"}
];

/* ================= Datos guardados en el celular ================= */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("pm_"+k); return v?JSON.parse(v):d; }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem("pm_"+k, JSON.stringify(v)); }catch{} }
};
const SAVED = { places:store.get("places",{}), recents:store.get("recents",[]), favs:store.get("favs",[]), sos:store.get("sos",null) };

/* ================= Estado ================= */
const S = {mode:"pas", step:"home", from:null, to:null, route:null, svc:"viaje", cur:"USD", usd:0, pay:"Efectivo $", mixUsd:1,
  women:false, recv:{name:"",phone:"",desc:""}, offers:[], chosen:null, prog:0, stars:5, picking:null, saveAs:null,
  pickName:"", results:[], timers:[], gps:null, curPos:null, panic:false, online:true, doneAt:null};
const $ = s => document.querySelector(s);
const fmtUSD = v => "$" + v.toFixed(2);
const fmtBs = v => "Bs. " + v.toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
const show = (u,c=S.cur) => c==="USD" ? fmtUSD(u) : fmtBs(u*RATE);
const other = (u,c=S.cur) => c==="USD" ? fmtBs(u*RATE) : fmtUSD(u);
const later = (f,ms) => S.timers.push(setTimeout(f,ms));
const clearT = () => { S.timers.forEach(clearTimeout); S.timers=[]; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = (s,n=22) => s.length>n ? s.slice(0,n-1)+"…" : s;
const isFav = d => SAVED.favs.includes(d.n);
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function waNum(p){ let d=String(p).replace(/\D/g,""); if(d.startsWith("0")) d="58"+d.slice(1); return d; }
const inVE = p => !!p && p.lat>0.6 && p.lat<12.3 && p.lng>-73.4 && p.lng<-59.7;   // Venezuela
const mapsLink = p => `https://maps.google.com/?q=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;

/* ================= Librería del mapa con servidores de respaldo ================= */
const LEAFLET = ["https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/","https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/","https://unpkg.com/leaflet@1.9.4/dist/"];
function loadLeaflet(i=0){
  return new Promise((ok,fail)=>{
    if(window.L) return ok();
    if(i>=LEAFLET.length) return fail(new Error("sin mapa"));
    const base=LEAFLET[i], min=base.includes("cdnjs")?".min":"", s=document.createElement("script");
    const t=setTimeout(()=>{ s.onerror=s.onload=null; loadLeaflet(i+1).then(ok,fail); },8000);
    s.src=base+"leaflet"+min+".js";
    s.onload=()=>{ clearTimeout(t); const c=document.createElement("link"); c.rel="stylesheet"; c.href=base+"leaflet"+min+".css"; document.head.prepend(c); ok(); };
    s.onerror=()=>{ clearTimeout(t); loadLeaflet(i+1).then(ok,fail); };
    document.head.appendChild(s);
  });
}

/* ================= Mapa ================= */
let map=null, meMk=null, fromMk=null, toMk=null, routeLn=null, tripMk=null, driverMks=[];
const M = f => { if(map) try{ f(); }catch(e){ console.warn(e); } };
const ESRI = n => `https://server.arcgisonline.com/ArcGIS/rest/services/${n}/MapServer/tile/{z}/{y}/{x}`;
const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : {matches:false};
const themePref = () => { try{ return JSON.parse(localStorage.getItem("pm_theme"))||"auto"; }catch{ return "auto"; } };
const isDark = () => { const t=themePref(); return t==="dark" || (t!=="light" && darkMQ.matches); };
let mapStyle="calles", tileLayers=[];
function setMapStyle(style){
  if(!map) return;
  mapStyle=style;
  tileLayers.forEach(l=>map.removeLayer(l)); tileLayers=[];
  const dk = style==="calles" && isDark() ? "dkmap" : "";
  const OSM = ["https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,maxNativeZoom:19,attribution:"© OpenStreetMap",className:dk}];
  const EST = [ESRI("World_Street_Map"),{maxZoom:19,maxNativeZoom:16,attribution:"© Esri · OpenStreetMap",className:dk}];
  let list;
  if(style==="satelite"){
    const o={maxZoom:19,maxNativeZoom:17,attribution:"© Esri · OpenStreetMap"};
    list=[[ESRI("World_Imagery"),o],[ESRI("Reference/World_Transportation"),{...o,attribution:""}],[ESRI("Reference/World_Boundaries_and_Places"),{...o,attribution:""}]];
  } else {
    // En el link (https) OpenStreetMap tiene calles con nombre hasta el zoom máximo; Esri queda de respaldo
    list = location.protocol==="https:" ? [OSM] : [EST];
  }
  let errs=0;
  list.forEach(([u,o],i)=>{
    const l=L.tileLayer(u,o).addTo(map);
    if(i===0 && style==="calles") l.on("tileerror",()=>{ if(++errs===6){
      tileLayers.forEach(x=>map.removeLayer(x));
      const alt = u===OSM[0] ? EST : OSM;
      tileLayers=[L.tileLayer(alt[0],alt[1]).addTo(map)]; } });
    tileLayers.push(l);
  });
  $("#stylebtn").textContent = style==="satelite" ? "🗺️ Calles" : "🛰️ Satélite";
}
darkMQ.addEventListener?.("change",()=>{ setThemeColor(); if(mapStyle==="calles") setMapStyle("calles"); });

const MOTO_SVG='<svg viewBox="6 4 108 72" width="24" height="16" aria-hidden="true" style="--a:currentColor"><g fill="var(--a)" stroke="var(--a)" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="58" r="13.5" fill="none" stroke-width="5"/><circle cx="26" cy="58" r="7.5" fill="none" stroke-width="1.5"/><circle cx="26" cy="58" r="2.6" stroke="none"/><circle cx="96" cy="58" r="13.5" fill="none" stroke-width="5"/><circle cx="96" cy="58" r="7.5" fill="none" stroke-width="1.5"/><circle cx="96" cy="58" r="2.6" stroke="none"/><path d="M26 51v14M19 58h14M96 51v14M89 58h14" stroke-width="1.1"/><path d="M26 58 L50 53" stroke-width="4" fill="none"/><path d="M84 42 Q96 35.5 108 43" fill="none" stroke-width="2.6"/><path d="M82 25 L96 58" stroke-width="4.6" fill="none"/></g><g fill="var(--a)" stroke="var(--b)" stroke-width="1.6" stroke-linejoin="round"><path d="M60 57 C54 62 46 62 40 57" fill="none" stroke="var(--a)" stroke-width="3.2" stroke-linecap="round"/><rect x="14" y="40" width="24" height="7.5" rx="3.75" transform="rotate(-12 26 43.75)"/><path d="M30 37 H54 L48 47 H36 Z"/><path d="M43 41 H63 L68 48 L64 57 H47 L41 49 Z"/><path d="M10 30.5 L27 32 L27 37 L17 39.5 Z"/><path d="M25 33.5 C33 29 43 29 51 32 L50 37 H27 Z"/><path d="M51 38 C53 28 63 23 77 25 L81 30 L77 38 Z"/><circle cx="87" cy="30" r="5.4"/></g><g fill="none" stroke-linecap="round"><path d="M73 18 L86 22" stroke="var(--a)" stroke-width="3"/><path d="M78 20 L76 12" stroke="var(--a)" stroke-width="1.6"/><ellipse cx="75.6" cy="10.5" rx="3" ry="2" fill="var(--a)"/><path d="M57 31 C63 28 69 27 76 28" stroke="var(--b)" stroke-width="1.6"/><path d="M47 46h15M46 50h16M48 54h12" stroke="var(--b)" stroke-width="1.1"/><circle cx="87" cy="30" r="2.4" fill="var(--b)"/></g></svg>';
const icon = cls => L.divIcon({className:"", html:`<div class="${cls}"></div>`, iconSize:[18,18], iconAnchor:[9,9]});
const ptIcon = color => L.divIcon({className:"", html:`<div class="pt" style="background:${color}"></div>`, iconSize:[18,18], iconAnchor:[9,9]});
const motoIcon = (extra="", size=32) => L.divIcon({className:"mv", html:`<div class="mk ${extra}"><span class="fl">${MOTO_SVG}</span></div>`, iconSize:[size,size], iconAnchor:[size/2,size/2]});
function faceMoto(mk, dLng, dLat=0){
  const sp=mk?.getElement()?.querySelector(".fl"); if(!sp || (!dLng && !dLat)) return;
  const west = dLng ? dLng<0 : sp.dataset.w==="1"; sp.dataset.w = west?"1":"0";
  // inclina la moto hacia donde va (sube o baja en el mapa), sin pasar de 35°
  const a = Math.max(-35, Math.min(35, -Math.atan2(dLat, Math.abs(dLng)||1e-9)*180/Math.PI));
  sp.style.transform = (west?"scaleX(-1) ":"")+`rotate(${a.toFixed(0)}deg)`;
}

function initMap(){
  map = L.map("map",{zoomControl:false, attributionControl:true, maxZoom:19}).setView([CARACAS.lat,CARACAS.lng],15);
  setMapStyle("calles");
  map.on("movestart",()=>{ if(S.picking) $("#cpin").classList.add("lift"); });
  map.on("moveend",onMoveEnd);
  map.on("zoomstart",()=>map.getContainer().classList.add("nomv"));
  map.on("zoomend",()=>setTimeout(()=>map.getContainer().classList.remove("nomv"),60));
  if(S.gps) meMk=L.marker(S.gps,{icon:icon("me"),interactive:false}).addTo(map);
  const c=S.gps||S.from; if(c) map.setView([c.lat,c.lng],16);
  $("#mapmsg").hidden=true;
  render();
}

/* ================= Ubicación (GPS) ================= */
function locate(first, precise=true){
  if(!("geolocation" in navigator)){ toast("Tu navegador no permite ubicación"); return fallback(); }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const p={lat:pos.coords.latitude, lng:pos.coords.longitude};
    const moved = !S.gps || Math.abs(S.gps.lat-p.lat)+Math.abs(S.gps.lng-p.lng) > .02;
    S.gps=p;
    M(()=>{ if(meMk) meMk.setLatLng(p); else meMk=L.marker(p,{icon:icon("me"),interactive:false}).addTo(map); map.setView(p,16);
      if(moved){ driverMks.forEach(d=>d.mk.remove()); driverMks=[]; } });
    if(first || !S.from || S.from.auto){
      S.from={...p, name:"Buscando dirección…"}; render();
      S.from.name=await reverse(p); render();
    } else render();
  }, err=>{
    if(err.code!==1 && precise) return locate(first,false);
    toast(err.code===1 ? "Activa el permiso de ubicación para usar tu GPS" : "No pudimos obtener tu ubicación");
    fallback();
  }, precise ? {enableHighAccuracy:true,timeout:10000,maximumAge:30000} : {enableHighAccuracy:false,timeout:15000,maximumAge:120000});
}
function fallback(){ if(!S.from){ S.from={...CARACAS, auto:true}; M(()=>map.setView([CARACAS.lat,CARACAS.lng],15)); render(); } }

async function reverse(p){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p.lat}&lon=${p.lng}&zoom=18&accept-language=es`);
    const d=await r.json(), a=d.address||{};
    const calle=a.road||a.pedestrian||a.neighbourhood||"", zona=a.suburb||a.neighbourhood||a.city_district||a.city||a.town||"";
    return [calle,zona].filter(Boolean).join(", ") || d.display_name?.split(",").slice(0,2).join(",") || "Punto en el mapa";
  }catch{ return `Punto ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`; }
}
async function search(q){
  const c=S.gps||S.from||CARACAS, vb=[c.lng-.35,c.lat+.35,c.lng+.35,c.lat-.35].join(",");
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&viewbox=${vb}${!S.gps||inVE(S.gps)?"&countrycodes=ve":""}&limit=6&accept-language=es`);
    const d=await r.json();
    return d.map(x=>({lat:+x.lat, lng:+x.lon, name:x.display_name.split(",")[0], sub:x.display_name.split(",").slice(1,3).join(",")}));
  }catch{ return []; }
}
async function getRoute(){
  if(!S.from||!S.to) return;
  const a=S.from, b=S.to;
  let coords=[a,...S.stops,b].map(q=>[q.lat,q.lng]), km=haversine(a,b)*1.3, min=Math.round(km*2.5+3);
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${[a,...S.stops,b].map(q=>q.lng+","+q.lat).join(";")}?overview=full&geometries=geojson`);
    const d=await r.json();
    if(d.routes?.[0]){ const rt=d.routes[0]; coords=rt.geometry.coordinates.map(c=>[c[1],c[0]]); km=rt.distance/1000; min=Math.round(rt.duration/60*.8); }
  }catch{}
  S.route={coords,km,min}; S.usd=suggest(); render(); fitRoute();
}
function haversine(a,b){ const R=6371,t=x=>x*Math.PI/180, dl=t(b.lat-a.lat), dg=t(b.lng-a.lng);
  return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2)); }
function suggest(){ if(!S.route) return 1.5; const b=Math.max(1.5,.8+S.route.km*.45)*(S.svc==="encomienda"?1.2:1); return Math.round((b+S.stops.length*.5)*2)/2; }
function fitRoute(){ if(map && routeLn) map.fitBounds(routeLn.getBounds(),{padding:[40,40]}); }

function drawLayers(){
  if(!map) return;
  const pas=S.mode==="pas";
  if(pas && S.from && !S.picking){ fromMk ? fromMk.setLatLng(S.from) : fromMk=L.marker(S.from,{icon:ptIcon("#16804a")}).addTo(map); }
  else if(fromMk){ fromMk.remove(); fromMk=null; }
  if(pas && S.to && !S.picking){ toMk ? toMk.setLatLng(S.to) : toMk=L.marker(S.to,{icon:ptIcon("#c23b2e")}).addTo(map); }
  else if(toMk){ toMk.remove(); toMk=null; }
  if(routeLn){ routeLn.remove(); routeLn=null; }
  if(pas && S.route && !S.picking){
    routeLn=L.polyline(S.route.coords,{color:getComputedStyle(document.documentElement).getPropertyValue("--route").trim()||"#14316b",weight:5,opacity:.9,dashArray:S.step==="trip"?null:"8 8"}).addTo(map);
  }
  if(tripMk && !(pas && S.step==="trip")){ tripMk.remove(); tripMk=null; }
  const showDrivers = (!pas && S.online) || (pas && !S.picking && (S.step==="home"||S.step==="offers"));
  if(!showDrivers){ driverMks.forEach(d=>d.mk.remove()); driverMks=[]; }
  else if(!driverMks.length) spawnDrivers();
  else if(pas && S.women) driverMks.forEach(d=>d.mk.setOpacity(d.f?1:.25));
  else driverMks.forEach(d=>d.mk.setOpacity(1));
  drawExtra();
  $("#cpin").hidden=!S.picking;
  $("#cpinHead").style.background = S.picking==="from" ? "#16804a" : S.picking==="stop" ? "#e8891a" : "#c23b2e";
}

/* ================= Motos circulando ================= */
function spawnDrivers(){
  if(!map) return;
  const c=S.gps||S.from||CARACAS;
  for(let i=0;i<7;i++){
    const f=i%3===0, lat=c.lat+(Math.random()-.5)*.014, lng=c.lng+(Math.random()-.5)*.014;
    const mk=L.marker([lat,lng],{icon:motoIcon(f?"f":""),interactive:false}).addTo(map);
    driverMks.push({mk,f,lat,lng,h:Math.random()*Math.PI*2,v:.00006+Math.random()*.00005});
  }
  drawLayers();
}
setInterval(()=>{
  if(!map || !driverMks.length || document.hidden) return;
  const c=S.gps||S.from||CARACAS;
  driverMks.forEach(d=>{
    const dLat=c.lat-d.lat, dLng=c.lng-d.lng;
    if(Math.hypot(dLat,dLng)>.009) d.h=Math.atan2(dLat,dLng)+(Math.random()-.5)*.6;
    else d.h+=(Math.random()-.5)*.7;
    if(Math.random()<.08) return;
    const nLat=d.lat+Math.sin(d.h)*d.v, nLng=d.lng+Math.cos(d.h)*d.v;
    faceMoto(d.mk,nLng-d.lng,nLat-d.lat); d.lat=nLat; d.lng=nLng; d.mk.setLatLng([nLat,nLng]);
  });
},1000);

/* ================= Elegir punto con pin central ================= */
function startPick(which, saveAs=null){
  S.picking=which; S.saveAs=saveAs; S.results=[]; S.pickName="Mueve el mapa…";
  const p=S[which]||S.gps||S.from||CARACAS;
  M(()=>map.setView([p.lat,p.lng],16));
  render();
}
let pickTimer;
function onMoveEnd(){
  if(!S.picking) return;
  $("#cpin").classList.remove("lift");
  clearTimeout(pickTimer);
  pickTimer=setTimeout(async()=>{
    const c=map.getCenter(); const el=$("#pickName"); if(el) el.textContent="Buscando dirección…";
    S.pickName=await reverse({lat:c.lat,lng:c.lng});
    const el2=$("#pickName"); if(el2) el2.textContent=S.pickName;
  },400);
}
function addRecent(p){
  SAVED.recents=[p,...SAVED.recents.filter(r=>r.name!==p.name)].slice(0,6);
  store.set("recents",SAVED.recents);
}
async function confirmPick(pt){
  let c=pt;
  if(!c){
    if(!map){ toast("Busca la dirección por nombre"); return; }
    const m=map.getCenter();
    c={lat:m.lat, lng:m.lng, name:(S.pickName && !/…$/.test(S.pickName)) ? S.pickName : await reverse({lat:m.lat,lng:m.lng})};
  }
  const which=S.picking||"to", place={lat:c.lat,lng:c.lng,name:c.name};
  if(which==="stop") S.stops.push(place); else S[which]=place;
  if(S.saveAs){ SAVED.places[S.saveAs]=place; store.set("places",SAVED.places); toast((S.saveAs==="casa"?"Casa":"Trabajo")+" guardado en tu celular"); }
  else if(which==="to") addRecent(place);
  S.picking=null; S.saveAs=null; S.route=null; render();
  if(S.from && S.to) getRoute();
}

/* ================= Pantallas: pasajero ================= */
function fieldBtn(which,dot,label,val,ph){
  return `<button class="field" data-pick="${which}"><span class="dot ${dot}"></span>
    <span class="txt"><small>${label}</small><span class="${val?"":"empty"}">${val?esc(val.name):ph}</span></span><span class="go">Cambiar</span></button>`;
}
function quick(){
  const p=SAVED.places, it=[];
  it.push(p.casa ? `<button class="chip" data-quick="casa">🏠 Casa</button>` : `<button class="chip" data-save="casa">🏠 Agregar casa</button>`);
  it.push(p.trabajo ? `<button class="chip" data-quick="trabajo">💼 Trabajo</button>` : `<button class="chip" data-save="trabajo">💼 Agregar trabajo</button>`);
  SAVED.recents.slice(0,4).forEach((r,i)=>it.push(`<button class="chip" data-recent="${i}">🕘 ${esc(short(r.name))}</button>`));
  return `<div class="quick" aria-label="Destinos rápidos">${it.join("")}</div>`;
}
function paySplit(usd){
  if(S.pay!==MIX) return S.pay;
  const cash=Math.min(S.mixUsd,Math.floor(usd));
  return `${fmtUSD(cash)} efectivo + ${fmtBs((usd-cash)*RATE)} Pago Móvil`;
}

  return `<div class="grab"></div>

  <div class="search"><input id="q" class="inp" type="search" placeholder="Busca calle, lugar o urbanización" autocomplete="off" enterkeyhint="search"></div>
  <div class="results">${S.results.map((x,i)=>`<button data-res="${i}"><strong>${esc(x.name)}</strong><span>${esc(x.sub)}</span></button>`).join("")}</div>
  ${isFrom&&S.gps?`<button class="ghost" id="useGps">📍 Usar mi ubicación actual</button>`:""}

const sheet=$("#sheet");
let lastView="";
function render(){
  $("#m-pas").setAttribute("aria-pressed",S.mode==="pas");
  $("#m-con").setAttribute("aria-pressed",S.mode==="con");
  const view = S.mode+"|"+(S.overlay||"")+"|"+(S.picking?"pick":S.step)+"|"+(S.dreg?.step||"")+(S.reg?.step||"")+(SAVED.driver?.status||"");
  if(view!==lastView){ sheet.style.height=""; sheet.style.maxHeight=""; sheet.scrollTop=0; lastView=view; }
  const scroll=sheet.scrollTop;
  const a=document.activeElement, keep=a&&a.id&&sheet.contains(a)?{id:a.id,s:a.selectionStart}:null;
  sheet.innerHTML = S.overlay ? OV[S.overlay]() : S.mode==="con" ? conView() : S.picking ? pick() : ({home,offers,trip,done,scheduled})[S.step]();
  sheet.scrollTop=scroll;
  if(keep){ const el=document.getElementById(keep.id); if(el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.s,keep.s); }catch{} } }
  drawLayers();
  M(()=>requestAnimationFrame(()=>map&&map.invalidateSize()));
}
let drag=null;
sheet.addEventListener("pointerdown",e=>{
  if(!e.target.closest(".grab")) return;
  drag={y:e.clientY,h:sheet.offsetHeight,moved:false};
  sheet.classList.add("dragging"); sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dy=e.clientY-drag.y; if(Math.abs(dy)>4) drag.moved=true;
  sheet.style.maxHeight="none"; sheet.style.height=Math.max(90,Math.min(innerHeight*.9,drag.h-dy))+"px";
});
function endDrag(){
  if(!drag) return;
  sheet.classList.remove("dragging");
  const snaps=[110, innerHeight*.55, innerHeight*.88];
  let h = drag.moved ? sheet.offsetHeight : (drag.h>150 ? 110 : innerHeight*.55);
  h=snaps.reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a);
  sheet.style.maxHeight="none"; sheet.style.height=h+"px"; drag=null;
  setTimeout(()=>M(()=>map.invalidateSize()),280);
}
sheet.addEventListener("pointerup",endDrag);
sheet.addEventListener("pointercancel",endDrag);

/* ================= Flujo ================= */
function startSearch(){
  S.step="offers"; S.offers=[]; clearT(); render();
  let pool=DRIVERS.filter(d=>!S.women||d.g==="f").sort(()=>Math.random()-.5);
  pool.sort((a,b)=>isFav(b)-isFav(a));
  pool.slice(0,4).forEach((d,i)=>later(()=>{
    if(S.step!=="offers") return;
    const bump = i===0 ? 0 : [0.5,1,0][i%3];
    S.offers.push({d, usd:S.usd+bump, eta:2+i*2+Math.floor(Math.random()*2)}); render();
  },900+i*1200));
}
function startTrip(o){
  clearT(); S.chosen=o; S.step="trip"; S.prog=0; S.panic=false;
  driverMks.forEach(d=>d.mk.remove()); driverMks=[];
  render();
  const pts=S.route.coords, o0=S.from, ang=Math.random()*Math.PI*2;
  const start=[o0.lat+Math.sin(ang)*.006, o0.lng+Math.cos(ang)*.006];
  S.curPos={lat:start[0],lng:start[1]};
  M(()=>{ tripMk=L.marker(start,{icon:motoIcon("trip",38),interactive:false,zIndexOffset:1000}).addTo(map);
    map.fitBounds(L.latLngBounds([start,[o0.lat,o0.lng]]).extend(routeLn?routeLn.getBounds():[o0.lat,o0.lng]),{padding:[40,40]}); });
  let last=start, lastTxt="";
  const tick=()=>{
    S.prog=Math.min(1,S.prog+.025);
    let pos;
    if(S.prog<.2){ const f=S.prog/.2; pos=[start[0]+(o0.lat-start[0])*f, start[1]+(o0.lng-start[1])*f]; }
    else { const f=(S.prog-.2)/.8; pos=pts[Math.min(pts.length-1,Math.floor(f*(pts.length-1)))]; }
    if(tripMk){ tripMk.setLatLng(pos); faceMoto(tripMk,pos[1]-last[1],pos[0]-last[0]); }
    last=pos; S.curPos={lat:pos[0],lng:pos[1]};
    const bar=$(".bar i"); if(bar) bar.style.width=Math.round(S.prog*100)+"%";
    const st=$(".status"), txt=trip().match(/<div class="status">(.*?)<\/div>/)[1];
    if(st && txt!==lastTxt){ st.innerHTML=txt; lastTxt=txt; }
    if(S.prog<1) later(tick,400); else later(finishTrip,900);
  };
  later(tick,600);
}

const API_URL = "https://pana-moto-api-production.up.railway.app";   // dirección del backend en Railway
const API = /^https?:\/\//.test(API_URL) ? API_URL.replace(/\/+$/,"") : "";

async function api(path, {method="GET", body, form, admin}={}){
  const h = {};
  if(SAVED.token && !admin) h.Authorization = "Bearer " + SAVED.token;
  if(admin) h["X-Admin-Key"] = SAVED.adminKey;
  if(body) h["Content-Type"] = "application/json";
  let r;
  try{ r = await fetch(API+path, {method, headers:h, body: form || (body ? JSON.stringify(body) : undefined)}); }
  catch{ throw new Error("Sin conexión con el servidor. Revisa tu señal e intenta de nuevo."); }
  let data = null; try{ data = await r.json(); }catch{}
  if(r.status===401 && !admin){ SAVED.token=null; save("token"); }
  if(!r.ok) throw new Error(data && typeof data.detail==="string" ? data.detail : `El servidor no respondió bien (${r.status}). Intenta de nuevo.`);
  return data;
}
async function apiBlob(path){
  const r = await fetch(API+path, {headers:{"X-Admin-Key":SAVED.adminKey}});
  if(!r.ok) throw new Error("No se pudo cargar la foto");
  return URL.createObjectURL(await r.blob());
}
function withBusy(btn, fn){
  if(busy) return; busy = true;
  if(btn){ btn.disabled = true; btn.textContent = "Un momento…"; }
  return fn().catch(err=>toast(err.message)).finally(()=>{ busy=false; render(); });
}
async function compressImg(file){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280/Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file), "image/jpeg", .8));
  }catch{ return file; }
}

/* ---------- Eventos que usan el servidor (se ejecutan antes que los de demo) ---------- */
document.addEventListener("click", e=>{
  if(!API) return;
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset, val = id => ($("#"+id)?.value||"").trim();
  const run = fn => { e.stopImmediatePropagation(); e.preventDefault(); withBusy(t, fn); };
  const stop = msg => { e.stopImmediatePropagation(); e.preventDefault(); toast(msg); };

  if(d.ov==="admin"){ S.adm.list=null; S.adm.big=null; }
  /* cuenta del pasajero */
  if(t.id==="rp-send"){ if(digits(S.reg.phone).length<9) return stop("Escribe un número válido, por ejemplo 0412-1234567");
    return run(async()=>{ const r = await api("/auth/send-code",{method:"POST",body:{phone:S.reg.phone}}); S.reg.sent="ok"; S.reg.demo=r.demo_code||""; S.reg.step=2; }); }
  if(t.id==="rp-verify"){ const code = val("rp-code"); if(code.length<4) return stop("Escribe los 4 dígitos");
    return run(async()=>{ const r = await api("/auth/verify",{method:"POST",body:{phone:S.reg.phone, code}});
      SAVED.token = r.token; save("token"); setUserFromServer(r.user);
      if(r.user.name){ S.reg=null; S.overlay=null; toast(`¡Hola de nuevo, ${firstName(r.user.name)}!`); } else S.reg.step=3; }); }
  if(t.id==="rp-done"){ const n = S.reg.name.trim(); if(n.length<2) return stop("Escribe tu nombre");
    return run(async()=>{ setUserFromServer(await api("/me",{method:"PUT",body:{name:n}})); S.reg=null; S.overlay=null; toast(`¡Bienvenido, ${firstName(n)}!`); }); }
  if(t.id==="logout"){ SAVED.token=null; save("token"); SAVED.driver=null; save("driver"); }

  /* registro del motorizado */
  if(t.id==="dr-send"){ if(digits(S.dreg.phone).length<9) return stop("Escribe un número válido, por ejemplo 0412-1234567");
    return run(async()=>{ const r = await api("/auth/send-code",{method:"POST",body:{phone:S.dreg.phone}}); S.dreg.sent="ok"; S.dreg.demo=r.demo_code||""; }); }
  if(t.id==="dr-verify"){ const code = val("dr-code"); if(code.length<4) return stop("Escribe los 4 dígitos");
    return run(async()=>{ const r = await api("/auth/verify",{method:"POST",body:{phone:S.dreg.phone, code}});
      SAVED.token = r.token; save("token"); setUserFromServer(r.user);
      if(r.user.driver) S.dreg = null; else { S.dreg.step = 2; if(!S.dreg.name && r.user.name) S.dreg.name = r.user.name; } }); }
  if(t.id==="dr-finish"){ const r = S.dreg;
    const need = ["perfil","cedula","selfie","licencia","carnet","rcv","moto"].filter(k=>!S.dregFiles[k]);
    if(need.length) return stop("Estamos procesando tus fotos. Intenta de nuevo en un segundo.");
    return run(async()=>{
      const fd = new FormData();
      Object.entries({full_name:r.name.trim(), ci:r.ci.trim(), sex:r.sex, model:r.model.trim(), plate:r.plate.trim(),
        bank:r.bank.trim(), pay_phone:r.payPhone, pay_ci:r.payCi, plan:r.plan, moto_color:r.color||""}).forEach(([k,v])=>fd.append(k,v));
      Object.entries(S.dregFiles).forEach(([k,b])=>fd.append(k, b, k+".jpg"));
      await api("/drivers/register",{method:"POST",form:fd});
      setUserFromServer(await api("/me"));
      SAVED.driver.plan = r.plan; SAVED.driver.phone = SAVED.acctPhone; save("driver");
      S.dreg=null; S.dregFiles={}; S.docThumbs={};
      toast("Registro enviado. Te avisaremos por WhatsApp.");
    }); }
  if(t.id==="dr-refresh") return run(async()=>{ setDriverFromServer(await api("/drivers/me")); toast("Estado actualizado"); });
  if(t.id==="dr-reset") return run(async()=>{ await api("/drivers/me",{method:"DELETE"}); SAVED.driver=null; save("driver"); S.dreg=null; });

  /* panel de administrador */
  if(t.id==="admLogin"){ const k = val("admkey"); if(!k) return stop("Escribe la clave");
    return run(async()=>{ SAVED.adminKey = k; try{ await api("/admin/check",{admin:true}); }catch(err){ SAVED.adminKey=""; throw err; }
      save("adminKey"); S.adm = {list:null, stats:null, thumbs:{}, loading:false, big:null}; }); }
  if(t.id==="admOut"){ e.stopImmediatePropagation(); SAVED.adminKey=""; save("adminKey"); S.adm.list=null; S.overlay=null; render(); return; }
  if(t.id==="admReload"){ e.stopImmediatePropagation(); S.adm.list=null; render(); return; }
  if(d.big!==undefined && S.overlay==="admin"){ e.stopImmediatePropagation(); S.adm.big = d.big || null; render(); if(d.big) sheet.scrollTop=0; return; }
  if(d.approve!==undefined && S.overlay==="admin") return run(async()=>{
    const r = await api(`/admin/drivers/${d.approve}/approve`,{method:"POST",admin:true}); toast(`Aprobado: ${r.name}`);
    if(SAVED.driver?.serverId===r.id) setDriverFromServer(r); S.adm.list=null; });
  if(d.reject!==undefined && S.overlay==="admin"){ const reason = val("rr-"+d.reject);
    return run(async()=>{ const r = await api(`/admin/drivers/${d.reject}/reject`,{method:"POST",admin:true,body:{reason}}); toast(`Rechazado: ${r.name}`);
      if(SAVED.driver?.serverId===r.id) setDriverFromServer(r); S.adm.list=null; }); }
  if(["adm-promo","adm-cp","adm-cm"].includes(t.id) && S.overlay==="admin"){
    const cur = S.adm.stats?.settings || {commission:comRate(), promo_first_month:SAVED.admin.promo};
    const body = t.id==="adm-promo" ? {promo_first_month:!cur.promo_first_month}
      : {commission: Math.min(.25, Math.max(.03, +(cur.commission + (t.id==="adm-cp"?.01:-.01)).toFixed(2)))};
    return run(async()=>{ const s = await api("/admin/settings",{method:"PUT",admin:true,body});
      if(S.adm.stats) S.adm.stats.settings = s; SAVED.admin.com = s.commission; SAVED.admin.promo = s.promo_first_month; save("admin"); });
  }
}, true);

function weekChart(d){
  const names=["D","L","M","M","J","V","S"], sample=[11.5,14,9.5,17,20.5,13], out=[];
  for(let i=6;i>=0;i--){
    const day=new Date(Date.now()-i*DAY), ds=day.toDateString();
    const real=d.trips.filter(t=>new Date(t.ts).toDateString()===ds).reduce((a,t)=>a+t.usd-t.com,0);
    out.push({l:names[day.getDay()], v:i===0?real:(real||sample[6-i]), today:i===0});
  }
  const max=Math.max(5,...out.map(o=>o.v)), tot=out.reduce((a,o)=>a+o.v,0);
  return `<div class="chart"><div class="ch-head"><span class="lbl">Ganancia de la semana</span><b>${show(tot,dCur)}</b></div>
    <div class="bars">${out.map(o=>`<div class="b ${o.today?"t":""}"><span style="height:${Math.max(3,Math.round(o.v/max*100))}%" title="${show(o.v,dCur)}"></span><small>${o.today?"Hoy":o.l}</small></div>`).join("")}</div>
    <p class="hint">Días anteriores con datos de ejemplo.</p></div>`;
}

  <div class="earn"><div><small>Cobrado</small><b>${show(gross,dCur)}</b></div><div><small>Comisión</small><b>−${show(com,dCur)}</b></div><div><small>Viajes</small><b>${tt.length}</b></div></div>

      <button data-counter="${r.i}" data-plus="1">+${dCur==="USD"?"$1":"Bs "+RATE.toFixed(0)}</button></div></div>`; }).join("")
  :`<div class="searching"><span class="pulse"></span>Buscando nuevas solicitudes…</div>`}`

function finishTrip(){
  const o=S.chosen;
  S.step="done"; S.doneAt=Date.now(); S.tip=0;
  S.discount=Math.min(SAVED.credit,o.usd);
  if(S.discount){ SAVED.credit=+(SAVED.credit-S.discount).toFixed(2); save("credit"); }
  SAVED.history.unshift({ts:S.doneAt, from:S.from, to:S.to, stops:[...S.stops], svc:S.svc, driver:o.d.n, usd:o.usd, tip:0,
    discount:S.discount, total:+(o.usd-S.discount).toFixed(2), stars:5});
  SAVED.history=SAVED.history.slice(0,30); save("history");
  render();
}
function updLastTrip(){ const h=SAVED.history[0]; if(!h||h.sched) return; h.tip=S.tip; h.stars=S.stars; h.total=+(h.usd+h.tip-h.discount).toFixed(2); save("history"); }

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset, D=SAVED.driver; let handled=true;
  const val = id => ($("#"+id)?.value||"").trim();

  if(t.id==="menuBtn"){ S.overlay = S.overlay==="menu" ? null : "menu"; }
  else if(t.hasAttribute("data-close")){ S.overlay = null; S.planSel=null; }
  else if(d.ov){ S.overlay=d.ov; S.planSel=null; }
  else if(t.id==="m-pas"||t.id==="m-con"){ S.overlay=null; handled=false; }

  /* registro del pasajero */
  else if(t.id==="rp-send"){ if(digits(S.reg.phone).length<10) return block("Escribe un número válido, por ejemplo 0412-1234567"); S.reg.sent=newCode(); S.reg.step=2; }

  else if(t.id==="rp-back"){ S.reg.step=1; }
  else if(t.id==="rp-done"){ const n=S.reg.name.trim(); if(n.length<2) return block("Escribe tu nombre");
    SAVED.user={name:n, phone:S.reg.phone, code:makeCode(n)}; save("user"); S.reg=null; S.overlay=null;
    toast(`¡Bienvenido, ${firstName(n)}!${S.afterReg?" Ya puedes pedir tu moto.":""}`); S.afterReg=null; }
  else if(t.id==="rp-skip"){ S.overlay=null; S.reg=null; }
  else if(t.id==="logout"){ SAVED.user=null; save("user"); S.reg=null; S.overlay="regpas"; }

  /* registro del motorizado */
  else if(t.id==="dr-useacct"){ S.dreg.step=2; if(!S.dreg.name && SAVED.user) S.dreg.name=SAVED.user.name; }
  else if(t.id==="dr-send"){ if(digits(S.dreg.phone).length<10) return block("Escribe un número válido, por ejemplo 0412-1234567"); S.dreg.sent=newCode(); }
  else if(t.id==="dr-verify"){ if(val("dr-code")!==S.dreg.sent) return block("Código incorrecto. Revisa tu WhatsApp."); S.dreg.step=2; }
  else if(t.id==="dr-rephone"){ S.dreg.sent=""; }
  else if(d.sex){ S.dreg.sex=d.sex; }
  else if(t.id==="dr-next"){ const r=S.dreg;
    if(r.step===2 && (r.name.trim().length<3 || digits(r.ci).length<6 || !r.sex)) return block("Completa nombre, cédula y sexo");
    if(r.step===3 && REQUIRED_DOCS.some(k=>!r.docs[k])) return block("Faltan fotos obligatorias");
    if(r.step===4 && (!r.model.trim() || r.plate.trim().length<5 || !r.docs.moto)) return block("Completa modelo, placa y foto de la moto");
    if(r.step===5 && (!r.bank.trim() || digits(r.payPhone).length<10)) return block("Completa banco y teléfono de Pago Móvil");
    r.step++; sheet.scrollTop=0; }
  else if(t.id==="dr-prev"){ S.dreg.step=Math.max(1,S.dreg.step-1); if(S.dreg.step===1) S.dreg.sent=""; }
  else if(d.plan){ if(S.dreg && !D) S.dreg.plan=d.plan; else S.planSel=d.plan; }
  else if(t.id==="dr-finish"){ const r=S.dreg, now=Date.now();
    SAVED.driver={name:r.name.trim(), ci:r.ci.trim(), sex:r.sex, phone:r.phone, model:r.model.trim(), plate:r.plate.trim(),
      docs:Object.keys(r.docs), bank:r.bank.trim(), payPhone:r.payPhone, payCi:r.payCi, plan:r.plan, status:"pending",
      balance:0, weekUntil:0, promoUntil:now+30*DAY, trips:[], createdAt:now};
    save("driver"); S.dreg=null; S.docThumbs={}; toast("Registro enviado. Te avisaremos por WhatsApp."); }
  else if(t.id==="dr-reset"){ SAVED.driver=null; save("driver"); S.dreg=null; }

  /* panel de administrador */
  else if(d.approve!==undefined){
    if(d.approve==="own"){ D.status="approved"; D.promoUntil=Date.now()+30*DAY; save("driver"); toast(`Aprobado: ${D.name}`); if(S.mode==="con") S.overlay=null; }
    else { const p=ADMIN_PENDING.splice(+d.approve,1)[0]; toast(`Aprobado: ${p.n}`); } }
  else if(d.reject!==undefined){
    if(d.reject==="own"){ D.status="rejected"; save("driver"); toast(`Rechazado: ${D.name}`); }
    else { const p=ADMIN_PENDING.splice(+d.reject,1)[0]; toast(`Rechazado: ${p.n}`); } }
  else if(t.id==="adm-promo"){ SAVED.admin.promo=!SAVED.admin.promo; save("admin"); }

  else if(t.id==="adm-cm"){ SAVED.admin.com=Math.max(.03,+(comRate()-.01).toFixed(2)); save("admin"); }

  else if(t.id==="rsend"){ const ref=digits(val("rref")); if(ref.length<4) return block("Escribe la referencia del pago");
    D.balance=+(D.balance+S.recAmt).toFixed(2); save("driver");
    SAVED.recargas.unshift({ts:Date.now(), amt:S.recAmt, method:S.recMethod, ref, name:D.name}); SAVED.recargas=SAVED.recargas.slice(0,20); save("recargas");

  else if(t.id==="planSave"){ const sel=S.planSel||D.plan;
    if(sel==="week" && !weekOn(D) && !promoOn(D)){
      if(D.balance<5){ S.overlay="recarga"; S.recAmt=5; render(); return block("Necesitas $5 de saldo para activar el plan semanal"); }
      D.balance=+(D.balance-5).toFixed(2); D.weekUntil=Date.now()+7*DAY; toast("Plan semanal activado por 7 días"); }
    else toast(sel==="week"&&promoOn(D)?"Plan semanal elegido. Se activa al terminar tu mes gratis.":"Plan guardado");
    D.plan=sel; save("driver"); S.planSel=null; S.overlay=null; }
  else if(d.take!==undefined && S.mode==="con" && D?.status==="approved"){
    const r=REQS[+d.take], c=tripCom(D,r.usd);

    if(S.taken.length>=REQS.length) setTimeout(()=>{ S.taken=[]; if(S.mode==="con") render(); },6000); }

      const w=S.when?new Date(S.when).getTime():0;

      if(S.svc==="encomienda" && !S.recv.name.trim()) return block("Escribe quién recibe la encomienda");
      SAVED.history.unshift({sched:true, when:w, ts:Date.now(), from:S.from, to:S.to, stops:[...S.stops], svc:S.svc, usd:S.usd, total:S.usd, driver:"Por asignar"});

  else if(d.tip!==undefined){ S.tip=+d.tip; updLastTrip(); }
  else if(d.star){ S.stars=+d.star; updLastTrip(); }
  else if(t.id==="again"){ S.stops=[]; S.whenMode="now"; S.when=""; S.tip=0; S.discount=0; handled=false; }
  else if(d.repeat!==undefined){ const h=SAVED.history[+d.repeat];
    Object.assign(S,{from:h.from, to:h.to, stops:[...(h.stops||[])], svc:h.svc, overlay:null, step:"home", route:null, whenMode:"now"}); getRoute(); }
  else if(d.hcancel!==undefined){ SAVED.history.splice(+d.hcancel,1); save("history"); toast("Viaje programado cancelado"); }
  else if(t.id==="copyCode"){ const c=SAVED.user.code;
