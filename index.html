  else if(t.id==="redeemBtn"){ const c=val("redeem").toUpperCase();
    if(!/^PANA-[A-Z]{1,4}\d{2}$/.test(c)) return block("Ese código no es válido");
    if(c===SAVED.user.code) return block("No puedes usar tu propio código");
    SAVED.credit=+(SAVED.credit+1).toFixed(2); SAVED.redeemed=true; save("credit"); save("redeemed"); toast("¡Ganaste $1! Se descuenta en tu próximo viaje."); }
  else handled=false;

  function block(msg){ e.stopPropagation(); e.preventDefault(); toast(msg); }
  if(handled){ e.stopPropagation(); e.preventDefault(); render(); }
},true);

/* ================= Fase 2: viajes en vivo con el servidor ================= */
if(API){
const PAL=["#1d3a8a","#b4532a","#16804a","#7a3fa0","#c2410c","#0f766e","#14316b","#334155"];
const dOf = r => ({id:r.id, n:r.name, first:r.first, c:PAL[r.id%PAL.length], moto:r.model+(r.moto_color?" · "+r.moto_color:""), color:r.moto_color||"", photo:r.photo_url?API+r.photo_url:"", motoPhoto:r.moto_url?API+r.moto_url:"", plate:r.plate, r:r.rating, v:r.trips,
  g:r.sex==="Mujer"?"f":"m", bank:r.bank||"", payPhone:r.pay_phone||"", payCi:r.pay_ci||"", phone:r.phone||""});
const pl = p => ({lat:+p.lat, lng:+p.lng, name:String(p.name||"Punto en el mapa").slice(0,160)});
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString("es-VE",{hour:"2-digit",minute:"2-digit"}) : "";
const etaKm = km => Math.max(1, Math.round(km*1.3/25*60));
const QUICK_P=["Ya bajo","Estoy en la puerta","¿Dónde estás?","Espérame 2 minutos"];
const QUICK_D=["Voy llegando","Estoy afuera","Hay tráfico, 5 minutos","¿Dónde te espero?"];
Object.assign(S,{srv:null, srvSig:"", feed:null, feedSig:"", chatOpen:false, nearby:[], rateD:5, dCancelAsk:false, selfCancel:false, srvHist:undefined, online:false, whenMode:"now", demand:false});
const ACT=["accepted","arrived","ongoing"];
let pollT=null, lastNearby=0, lastLocPost=0, watchId=null, audioCtx=null;

function beep(){
  try{ navigator.vibrate?.(180); }catch{}
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; g.gain.value=.08;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.18); }catch{}
}
function kick(ms=0){ clearTimeout(pollT); pollT=setTimeout(poll, ms); }
async function poll(){
  let next=6000;
  try{
    if(SAVED.token && !document.hidden){
      if(S.mode==="pas"){
        const r=await api("/trips/active"); applyPas(r.trip);
        if(S.srv) next=2500;
        if(["home","offers"].includes(S.step) && !S.srv?.driver && Date.now()-lastNearby>10000){
          const c=S.from||S.gps; lastNearby=Date.now();
          if(c){ S.nearby=await api(`/drivers/nearby?lat=${c.lat}&lng=${c.lng}`); drawLive(); }
        }
      } else if(SAVED.driver?.status==="approved"){
        if(S.online) await postLoc(true);
        applyFeed(await api("/driver/feed"));
        next=(S.online||S.feed?.active)?3000:8000;
      }
    }
  }catch(e){ console.warn(e); }

}

/* ---------- Pasajero ---------- */
function driverPos(t){ return t?.driver_loc ? {lat:t.driver_loc.lat, lng:t.driver_loc.lng} : null; }
function moveTripMk(t){
  const p=driverPos(t); if(!p) return;
  S.curPos=p;
  M(()=>{ if(!tripMk) tripMk=L.marker(p,{icon:motoIcon("trip",38),interactive:false,zIndexOffset:1000}).addTo(map);
    else { const o=tripMk.getLatLng(); tripMk.setLatLng(p); faceMoto(tripMk,p.lng-o.lng,p.lat-o.lat); } });
}
function tripEta(t){ const p=driverPos(t); return p ? etaKm(haversine(p,t.from)) : null; }
function applyPas(t){
  const prev=S.srv; S.srv=t;
  if(!t){
    if(prev && ["offers","trip"].includes(S.step)){
      S.step="home"; S.chatOpen=false;
      toast(prev.status==="searching" ? "Nadie aceptó a tiempo. Sube tu oferta e intenta de nuevo." : "Tu viaje terminó.");
      render();
    }
    S.srvSig=""; return;
  }
  if(!prev || prev.id!==t.id){   // retomar un viaje al abrir la app
    Object.assign(S,{from:{...t.from}, to:{...t.to}, stops:t.stops||[], svc:t.svc, pay:t.pay_method, women:t.women_only, mixUsd:t.mix_cash,
      recv:{name:t.recv.name, phone:t.recv.phone, desc:t.recv.desc}});
    if(!S.route) S.route={coords:[[t.from.lat,t.from.lng],...(t.stops||[]).map(s=>[s.lat,s.lng]),[t.to.lat,t.to.lng]], km:t.km, min:t.minutes};
  }
  if(t.notice && t.notice!==prev?.notice) toast(t.notice);
  if(t.status==="searching"){
    S.step="offers"; S.usd=t.offer_usd;
    S.offers=(t.offers||[]).map(o=>({id:o.id, d:dOf(o.driver), usd:o.amount_usd, eta:o.eta_min}));
    S.offers.sort((a,b)=>isFav(b.d)-isFav(a.d));
    if(prev?.status==="searching" && (t.offers||[]).some(o=>!(prev.offers||[]).find(p=>p.id===o.id))){ beep(); toast("Nueva oferta de un motorizado"); }
  } else if(ACT.includes(t.status)){
    S.chosen={d:dOf(t.driver), usd:t.final_usd, eta:tripEta(t)||5};
    if(S.step!=="trip"){
      S.step="trip"; S.panic=false; S.chatOpen=false;
      if(prev?.status==="searching"){ beep(); }
      moveTripMk(t);
      M(()=>{ const p=driverPos(t); if(p) map.fitBounds(L.latLngBounds([[p.lat,p.lng],[t.from.lat,t.from.lng]]),{padding:[60,60],maxZoom:16}); });
    }
    if(prev && prev.status!==t.status){
      if(t.status==="arrived"){ beep(); toast(`¡${S.chosen.d.first} llegó! Sal a encontrarte con tu motorizado.`); }
      if(t.status==="ongoing") toast("Viaje iniciado. ¡Buen viaje!");
    }
    const pm=prev?.messages||[], nm=t.messages||[];
    if(prev && nm.length>pm.length && nm[nm.length-1].from==="d"){ beep(); if(!S.chatOpen) toast(`💬 ${S.chosen.d.first}: ${nm[nm.length-1].text}`); }
    moveTripMk(t);
  } else if(t.status==="completed" && S.step!=="done"){
    S.chosen={d:dOf(t.driver), usd:t.final_usd};
    S.step="done"; S.doneAt=Date.parse(t.completed_at); S.tip=0; S.stars=5; S.discount=0; S.chatOpen=false;
    if(prev) beep();
  }
  const sig=JSON.stringify({...t, driver_loc:null});
  if(sig!==S.srvSig){ S.srvSig=sig; if(S.mode==="pas" && !S.overlay && !S.picking) render(); }
  else if(S.step==="trip"){ const st=$(".status"); if(st) st.innerHTML=tripStatus(t); const b=$(".bar i"); if(b) b.style.width=tripPct(t)+"%"; }
}
function tripStatus(t){
  if(t.status==="accepted"){ const e=tripEta(t); return e ? `Tu motorizado llega en ${e} min` : "Tu motorizado va en camino"; }
  if(t.status==="arrived") return "¡Llegó! Sal a encontrarte con tu motorizado";
  return "En viaje a "+esc(t.to.name);
}
function tripPct(t){
  if(t.status==="accepted") return 15;
  if(t.status==="arrived") return 30;
  const p=driverPos(t); if(!p) return 50;
  const total=Math.max(.1,haversine(t.from,t.to)), left=haversine(p,t.to);
  return Math.round(30+70*Math.max(0,Math.min(1,1-left/total)));
}
function payTextT(t, usd){
  if(t.pay_method!==MIX) return t.pay_method;
  const cash=Math.min(t.mix_cash, Math.floor(usd));

}

    M(()=>{ if(meMk) meMk.setLatLng(S.gps); else meMk=L.marker(S.gps,{icon:icon("me"),interactive:false}).addTo(map); });
    postLoc(false);
  }, ()=>toast("Activa tu ubicación para recibir viajes"), {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function stopGps(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
async function postLoc(force){
  if(!S.online || !S.gps) return;
  if(Date.now()-lastLocPost < (force?8000:4000)) return;
  lastLocPost=Date.now();
  try{ await api("/driver/location",{method:"POST",body:{lat:S.gps.lat, lng:S.gps.lng, online:true}}); }catch{}
}
function applyFeed(f){
  const prev=S.feed; S.feed=f;

  if(prev){
    if(f.requests.some(r=>!prev.requests.find(p=>p.id===r.id))){ beep(); if(S.mode==="con" && !f.active) toast("Nueva solicitud cerca de ti"); }
    if(!prev.active && f.active && f.active.status==="accepted"){ beep(); toast(`¡${f.active.passenger.first} aceptó tu oferta! Ve a recogerlo.`); S.chatOpen=false; S.dCancelAsk=false; }
    if(prev.active && !f.active && prev.active.status!=="completed" && !S.selfCancel){ beep(); toast("El pasajero canceló el viaje."); }
    if(prev.active && f.active && prev.active.id===f.active.id){
      const pm=prev.active.messages||[], nm=f.active.messages||[];
      if(nm.length>pm.length && nm[nm.length-1].from==="p"){ beep(); if(!S.chatOpen) toast(`💬 ${f.active.passenger.first}: ${nm[nm.length-1].text}`); }
    }
  }
  if(!f.active) S.selfCancel=false;
  const sig=JSON.stringify({a:f.active, r:f.requests.map(r=>[r.id,r.offer_usd,r.my_offer?.status,r.my_offer?.amount_usd,Math.round(r.pickup_km*2)]), s:f.stats, p:f.promo_active, w:f.wallet});

}

/* ---------- Notificaciones ---------- */
async function pushStatus(){
  if(!pushOK()) return isIOS&&!standalone() ? "ios" : "unsupported";
  if(Notification.permission==="denied") return "denied";
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); return sub&&Notification.permission==="granted"?"on":"off"; }
  catch{ return "off"; }
}
async function enablePush(){
  if(!pushOK()) throw new Error(isIOS?"En iPhone, primero instala la app: Compartir → Agregar a inicio.":"Este navegador no permite notificaciones. Usa Chrome.");
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){ S.pushState=perm==="denied"?"denied":"off"; throw new Error("Permite las notificaciones para recibir avisos de tus viajes"); }
  const reg=await navigator.serviceWorker.ready, {public_key}=await api("/push/key");
  let sub=await reg.pushManager.getSubscription();
  if(sub){ try{ await api("/push/subscribe",{method:"POST",body:sub.toJSON()}); S.pushState="on"; return; }catch{ await sub.unsubscribe().catch(()=>{}); sub=null; } }
  sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u8(public_key)});
  await api("/push/subscribe",{method:"POST",body:sub.toJSON()});
  S.pushState="on";
}
async function syncPush(){
  S.pushState=await pushStatus();
  if(S.pushState==="on" && SAVED.token){
    try{ const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription(); await api("/push/subscribe",{method:"POST",body:sub.toJSON()}); }catch{}
  }
  render();
}

window.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset, val=id=>($("#"+id)?.value||"").trim();
  const stop=()=>{ e.stopImmediatePropagation(); e.preventDefault(); };
  const run=fn=>{ stop(); withBusy(t, fn); };
  if(t.id==="pushOn") return run(async()=>{ await enablePush(); toast("¡Avisos activados! Te avisaremos aunque cierres la app."); });
  if(t.id==="pushMenu") return run(async()=>{ if(S.pushState!=="on") await enablePush(); await api("/push/test",{method:"POST"}); toast("Te enviamos un aviso de prueba. Bloquea el celular para verlo."); });
  if(d.ov==="wallet"||d.ov==="wplan"){ S.wallet=null; return; }
  if(d.ov==="admin"){ resetAdm(); return; }
  if(d.wamt){ stop(); S.wAmt=+d.wamt; render(); return; }
  if(d.wmet){ stop(); S.wMet=d.wmet; render(); return; }
  if(t.id==="wSend"){ const ref=val("wref"); if(digits(ref).length<4 && ref.length<6){ stop(); return toast("Escribe la referencia del pago"); }
    return run(async()=>{ await api("/driver/recharges",{method:"POST",body:{amount_usd:S.wAmt, method:S.wMet, reference:ref}}); S.wallet=null; toast("Pago reportado. Te avisamos cuando lo aprobemos."); }); }
  if(t.id==="wWeek") return run(async()=>{ await api("/driver/plan",{method:"POST",body:{plan:"week"}}); S.wallet=null; toast("Plan semanal activado por 7 días"); kick(300); });
  if(t.id==="delYes") return run(async()=>{ await api("/me",{method:"DELETE"});
    SAVED.token=null; save("token"); SAVED.user=null; save("user"); SAVED.driver=null; save("driver"); S.srv=null; S.feed=null; S.step="home"; S.overlay="regpas"; S.reg=null;
    toast("Tu cuenta fue eliminada"); });
  if(S.overlay!=="admin") return;
  /* administrador */
  if(t.id==="admLogin"){ const k=val("admkey"); if(!k){ stop(); return toast("Escribe la clave"); }
    return run(async()=>{ SAVED.adminKey=k; try{ await api("/admin/check",{admin:true}); }catch(err){ SAVED.adminKey=""; throw err; } save("adminKey"); resetAdm(); }); }
  if(d.atab){ stop(); S.adm.tab=d.atab; resetAdm(); render(); sheet.scrollTop=0; return; }
  if(t.id==="admRefresh"){ stop(); resetAdm(); render(); return; }
  if(t.id==="admReload"){ stop(); resetAdm(); render(); return; }
  if(d.rok) return run(async()=>{ const r=await api(`/admin/recharges/${d.rok}/approve`,{method:"POST",admin:true}); toast(`Recarga aprobada. Nuevo saldo: ${fmtUSD(r.balance)}`); S.adm.rech=null; S.adm.summary=null; });
  if(d.rno) return run(async()=>{ await api(`/admin/recharges/${d.rno}/reject`,{method:"POST",admin:true,body:{reason:val("rn-"+d.rno)}}); toast("Recarga rechazada"); S.adm.rech=null; S.adm.summary=null; });
  if(t.id==="uSearch"){ stop(); S.adm.uq=val("uq"); S.adm.users=null; render(); return; }
  if(d.ublock) return run(async()=>{ await api(`/admin/users/${d.ublock}/block`,{method:"POST",admin:true,body:{blocked:d.val==="1"}}); toast(d.val==="1"?"Usuario bloqueado":"Usuario desbloqueado"); S.adm.users=null; });
  if(d.uadj){ const amt=parseFloat(val("adj-"+d.uadj).replace(",",".")); if(!amt){ stop(); return toast("Escribe el monto a sumar o restar"); }
    return run(async()=>{ const r=await api(`/admin/drivers/${d.uadj}/adjust`,{method:"POST",admin:true,body:{amount_usd:amt, note:val("adjn-"+d.uadj)}}); toast(`Saldo ajustado: ${fmtUSD(r.balance)}`); S.adm.users=null; }); }
  const c=S.adm.summary?.settings;
  if(c && t.id==="adm-promo") return run(()=>putSettings({promo_first_month:!c.promo_first_month}));
  if(c && (t.id==="adm-cp"||t.id==="adm-cm")) return run(()=>putSettings({commission:Math.min(.25,Math.max(0,+(c.commission+(t.id==="adm-cp"?.01:-.01)).toFixed(2)))}));
  if(c && (t.id==="adm-wp"||t.id==="adm-wm")) return run(()=>putSettings({week_plan_usd:Math.max(0,+(c.week_plan_usd+(t.id==="adm-wp"?.5:-.5)).toFixed(2))}));
  if(t.id==="admRinfo") return run(async()=>{ await putSettings({recharge_info:$("#rinfo").value.trim()}); toast("Datos de pago guardados"); });

  if(t.id==="admBcvRefresh") return run(async()=>{ const b=await api("/admin/bcv/refresh",{method:"POST",admin:true}); if(S.adm.summary) S.adm.summary.bcv=b; if(b.rate){ RATE=+b.rate; S.bcv=b; }

const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const svgIc = (k, cls="ic") => { const b=ICONS[k]; if(!b) return ""; const f=b.startsWith("f|");
  return `<svg class="${cls}" viewBox="0 0 24 24" ${f?'fill="currentColor" stroke="none"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${f?b.slice(2):b}</svg>`; };
const EMO_RE = new RegExp("("+Object.keys(ICONS).filter(k=>k[0]!=="@").concat(["🟢","⚪"]).sort((a,b)=>b.length-a.length)
  .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\uFE0F?","g");
function iconize(root){
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{
    if(!EMO_RE.test(n.nodeValue)){ EMO_RE.lastIndex=0; return NodeFilter.FILTER_REJECT; } EMO_RE.lastIndex=0;
    return n.parentElement.closest("textarea,script,style,.msg,.noicon") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while(tw.nextNode()) list.push(tw.currentNode);
  list.forEach(n=>{
    const span=document.createElement("span"); span.className="icw";
    span.innerHTML = esc(n.nodeValue).replace(EMO_RE, (m,k)=> k==="🟢" ? '<span class="sdot on"></span>' : k==="⚪" ? '<span class="sdot"></span>' : svgIc(k));
    n.replaceWith(span);
  });
}
function skeletons(root){
  root.querySelectorAll(".searching").forEach(el=>{
    const t=el.textContent.trim(); if(!/^(Cargando|Conectando)/.test(t)) return;
    const k=document.createElement("div"); k.className="skel"; k.setAttribute("role","status"); k.setAttribute("aria-label",t);
    k.innerHTML="<i></i><i></i><i></i>"; el.replaceWith(k);
  });
}
let seenOffers=new Set(), offersView="";
function markNewOffers(root){
  const els=[...root.querySelectorAll(".offer")]; if(!els.length){ seenOffers=new Set(); return; }
  const key=el=>(el.querySelector(".who strong")?.textContent||"")+"|"+(el.querySelector(".amt strong")?.textContent||"");
  const fresh=lastView!==offersView; offersView=lastView;
  els.forEach(el=>{ const k=key(el); if(!seenOffers.has(k) && !fresh) el.classList.add("new"); seenOffers.add(k); });
  if(fresh) els.forEach((el,i)=>{ el.classList.add("new"); el.style.animationDelay=(i*.06)+"s"; });
}
const _renderPol = render;
render = function(){
  const before=lastView;
  _renderPol();
  iconize(sheet); skeletons(sheet); markNewOffers(sheet);
  if(before!==lastView && !REDUCE){ sheet.classList.remove("enter"); void sheet.offsetWidth; sheet.classList.add("enter");
    clearTimeout(render.t); render.t=setTimeout(()=>sheet.classList.remove("enter"),1300); }
};

    if(!t) mk.bindTooltip(txt,{permanent:true,direction:"top",offset:[0,-10],className:"pinlbl"}); else if(t.getContent()!==txt) mk.setTooltipContent(txt); };

// Ofertas: etiquetas y barra de tiempo (la oferta vence a los 60 s, como en InDrive)
const OFFER_TTL=60, offerSeen={}, offerGone=new Set();
function decorateOffers(root){
  const els=[...root.querySelectorAll(".offer")]; if(!els.length || els.length!==S.offers.length) return;
  const list=S.offers, many=list.length>1;
  const minU=Math.min(...list.map(o=>o.usd)), minE=Math.min(...list.map(o=>o.eta)), maxR=Math.max(...list.map(o=>+o.d.r||0));
  const used=new Set();
  els.forEach((el,i)=>{
    const o=list[i], key=o.id??(o.d.n+o.usd);
    if(!offerSeen[key]){ offerSeen[key]=Date.now(); try{ navigator.vibrate?.(80); }catch{} }
    let tag=null;
    if(many){
      if(o.usd===minU && !used.has("cheap")) tag=["cheap","Más barato"];
      else if(o.eta===minE && !used.has("fast")) tag=["fast","Llega primero"];
      else if(+o.d.r===maxR && !used.has("best")) tag=["best",o.d.g==="f"?"Mejor calificada":"Mejor calificado"];
      if(tag) used.add(tag[0]);
    }
    if(tag) el.insertAdjacentHTML("afterbegin",`<span class="otag ${tag[0]}">${tag[1]}</span>`);
    if(API && o.id!=null){
      const rem=Math.max(0,OFFER_TTL-(Date.now()-offerSeen[key])/1000);
      el.insertAdjacentHTML("beforeend",`<div class="tbar" aria-hidden="true"><i style="--w:${(rem/OFFER_TTL*100).toFixed(1)}%;--t:${rem.toFixed(1)}s"></i></div>`);
    }
  });
}
setInterval(()=>{
  if(!API || S.step!=="offers" || !S.srv?.id) return;
  S.offers.forEach(o=>{
    if(o.id==null || offerGone.has(o.id) || !offerSeen[o.id] || Date.now()-offerSeen[o.id]<OFFER_TTL*1000) return;
    offerGone.add(o.id);
    api(`/trips/${S.srv.id}/offers/${o.id}/reject`,{method:"POST"}).catch(()=>{});
  });
},1000);

// Viaje: tramo recorrido en gris y hora de llegada sobre el mapa
let walkedLn=null;
const kmBetween=(a,b)=>{ const R=6371,r=Math.PI/180, dLa=(b[0]-a[0])*r, dLo=(b[1]-a[1])*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const _drawLayersL2 = drawLayers;
drawLayers = function(){
  _drawLayersL2();
  if(!map) return;
  if(walkedLn){ walkedLn.remove(); walkedLn=null; }
  const t=S.srv, cp=S.curPos, pos=cp?(Array.isArray(cp)?cp:[cp.lat,cp.lng]):null;
  if(S.mode==="pas" && S.step==="trip" && t?.status==="ongoing" && pos && routeLn && S.route?.coords?.length>1){
    const c=S.route.coords; let bi=0, bd=1e9;
    c.forEach((p,i)=>{ const d=kmBetween(p,pos); if(d<bd){ bd=d; bi=i; } });
    const ahead=[pos,...c.slice(bi+1)], behind=[...c.slice(0,bi+1),pos];
    routeLn.setLatLngs(ahead); routeCase && routeCase.setLatLngs(ahead);
    walkedLn=L.polyline(behind,{color:"#9aa3b5",weight:5,opacity:.95,dashArray:"2 9",lineCap:"round",interactive:false}).addTo(map);
  }
};
function etaChip(){
  let el=$("#etachip");
  const t=S.srv, cp=S.curPos, pos=cp?(Array.isArray(cp)?cp:[cp.lat,cp.lng]):null, show_=S.mode==="pas" && S.step==="trip" && t && pos && ["accepted","ongoing"].includes(t.status);
  if(!show_){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="etachip"; el.className="etachip"; $(".mapwrap").appendChild(el); }
  const goal = t.status==="ongoing" ? [t.to.lat,t.to.lng] : [t.from.lat,t.from.lng];
  const min=Math.max(1,Math.round(kmBetween(pos,goal)*1.3/25*60));
  const at=new Date(Date.now()+min*60000).toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"});
  el.innerHTML = `${svgI("🕐")} ${t.status==="ongoing"?`Llegas ${at} · ${min} min`:`Tu moto llega en ${min} min`}`;
}

  const d=new Date(), m=L_.filter(x=>{ const t=new Date(x.completed_at); return t.getMonth()===d.getMonth() && t.getFullYear()===d.getFullYear(); });
  const spent=m.reduce((a,x)=>a+(x.usd||0)+(x.tip_usd||0),0);
  return h.replace(/(<div class="ovhead">[\s\S]*?<\/div>)/, `$1<div class="histtot"><div><small>Este mes</small><b>${m.length} viaje${m.length===1?"":"s"}</b></div><div><small>Gastado</small><b>${fmtUSD(spent)}</b></div></div>`); };


/* ================= Elegir punto: tocar el mapa o arrastrar el pin ================= */
const _initMapPk = initMap;
initMap = function(){
  _initMapPk();
  if(!map) return;
  map.on("click", e=>{ if(S.picking) map.panTo(e.latlng,{animate:!REDUCE}); });   // tocas un punto y el pin va ahí
};
(()=>{
  const pin=$("#cpin"), head=$("#cpinHead"); let st=null;
  head.addEventListener("pointerdown", e=>{
    if(!S.picking || !map) return;
    e.preventDefault(); e.stopPropagation(); head.setPointerCapture(e.pointerId);
    st={x:e.clientX, y:e.clientY, dx:0, dy:0}; pin.classList.add("dragpin","lift");
  });
  head.addEventListener("pointermove", e=>{
    if(!st) return;
    st.dx=e.clientX-st.x; st.dy=e.clientY-st.y;
    pin.style.setProperty("--dx",st.dx+"px"); pin.style.setProperty("--dy",st.dy+"px");
  });
  const end=()=>{
    if(!st) return;
    const {dx,dy}=st; st=null;
    pin.classList.remove("dragpin"); pin.style.setProperty("--dx","0px"); pin.style.setProperty("--dy","0px");
    if(Math.abs(dx)+Math.abs(dy)<4){ pin.classList.remove("lift"); return; }
    // el punto donde soltaste el pin pasa a ser el centro del mapa
    const c=map.getSize().divideBy(2), ll=map.containerPointToLatLng([c.x+dx, c.y+dy]);
    map.panTo(ll,{animate:!REDUCE});
  };
  head.addEventListener("pointerup", end); head.addEventListener("pointercancel", end);
})();


/* ================= Foto de perfil del pasajero ================= */
const mediaSrc = u => u ? (u.startsWith("http") ? u : API+u) : null;
const _setUserPh = setUserFromServer;
setUserFromServer = function(u){ _setUserPh(u); if(SAVED.user){ SAVED.user.photo_url=u.photo_url||null; save("user"); } };
OV.mephoto = () => {
  const u=SAVED.user||{}, ph=mediaSrc(u.photo_url);
  return `<div class="grab"></div><div class="ovhead"><h2>Tu foto de perfil</h2>${closeBtn()}</div>
  <div class="mephoto">${ph?`<img src="${ph}" alt="Tu foto">`:`<div class="bigav">${esc((u.name||"P")[0])}</div>`}</div>
  <p class="hint" style="text-align:center">Tu motorizado la ve cuando acepta tu viaje, para reconocerte al llegar. Es opcional y puedes quitarla cuando quieras.</p>
  <div class="mpbtns"><label class="ghost" for="mpCam">📷 Cámara</label><label class="ghost" for="mpGal">🖼️ Galería</label></div>
  <input id="mpCam" type="file" accept="image/*" capture="user" class="vh" data-mephoto>
  <input id="mpGal" type="file" accept="image/*" class="vh" data-mephoto>
  <p class="hint">Consejo: una foto de tu cara con buena luz, sin lentes oscuros.</p>
  ${ph?`<button class="link" id="mpDel" style="color:var(--bad)">Quitar mi foto</button>`:""}`;
};
document.addEventListener("change", async e=>{
  const inp=e.target.closest("[data-mephoto]"); if(!inp || !inp.files?.[0]) return;
  if(!API || !SAVED.token){ toast("Crea tu cuenta para agregar tu foto"); return; }
  try{
    toast("Subiendo tu foto…");
    const blob=await compressImg(inp.files[0]); const fd=new FormData(); fd.append("photo", blob, "perfil.jpg");
    const r=await api("/me/photo",{method:"PUT",form:fd});
    SAVED.user.photo_url=r.photo_url; save("user"); toast("¡Listo! Tu motorizado te verá al aceptar tu viaje"); render();
  }catch(err){ toast(err.message); }
  inp.value="";
});
window.addEventListener("click", e=>{
  if(e.target.closest("#mpDel")){ e.stopImmediatePropagation();
    api("/me/photo",{method:"DELETE"}).then(()=>{ SAVED.user.photo_url=null; save("user"); toast("Quitamos tu foto"); render(); }).catch(err=>toast(err.message)); return; }
  if(e.target.closest("#pcLater")){ e.stopImmediatePropagation(); try{ localStorage.setItem("pm_nophoto","1"); }catch{} render(); return; }
  const del=e.target.closest("[data-uphotodel]");
  if(del){ e.stopImmediatePropagation();
    api(`/admin/users/${del.dataset.uphotodel}/photo`,{method:"DELETE",admin:true}).then(()=>{ toast("Foto quitada"); S.adm.users=null; render(); }).catch(err=>toast(err.message)); }
}, true);
// Inicio: invitación a poner la foto (una sola vez, se puede cerrar)
const _homePh = home;
home = function(){
  const h=_homePh(); let later=false; try{ later=!!localStorage.getItem("pm_nophoto"); }catch{}
  if(!API || !SAVED.user || SAVED.user.photo_url || later || S.to || S.step!=="home") return h;
  const card=`<div class="photocard"><div class="pc-av">${svgIc("📷")}</div><span><b>Agrega tu foto</b>Así tu motorizado te reconoce al llegar.</span><button class="cta" data-ov="mephoto">Agregar</button><button class="x sm" id="pcLater" aria-label="Ahora no">✕</button></div>`;
  return h.replace('<h2>¿A dónde vas, pana?</h2>', card+'<h2>¿A dónde vas, pana?</h2>');
};
// Menú lateral: foto del pasajero (tocarla abre "Tu foto de perfil")
const _drawerHTMLPh = drawerHTML;
drawerHTML = function(){
  let h=_drawerHTMLPh(); const u=SAVED.user;
  if(!u || (S.mode==="con" && SAVED.driver?.status==="approved" && S.feed)) return h;
  const ph=mediaSrc(u.photo_url);
  h=h.replace(`<div class="dme"><div class="bav">${esc((u.name||"P")[0])}</div>`,
    `<div class="dme"><button class="bavbtn" data-ov="mephoto" aria-label="Cambiar tu foto de perfil">${ph?`<img class="bav" src="${ph}" alt="">`:`<div class="bav">${esc((u.name||"P")[0])}</div>`}<span class="cam">${svgIc("📷")}</span></button>`);
  return h.replace('<button class="it" data-ov="history">', `<button class="it" data-ov="mephoto">${DIC("📷")}<span class="tt">Tu foto de perfil</span><small>${ph?"Cambiar":"Agregar"}</small></button><button class="it" data-ov="history">`);
};
// Motorizado: ve la foto del pasajero en las solicitudes y en el viaje; admin: ve y puede quitar fotos
function passengerPhotos(root){
  const F=S.feed;
  if(S.mode==="con" && F){
    if(F.active){ const ph=mediaSrc(F.active.passenger?.photo_url), av=root.querySelector(".driver .av");
      if(ph && av && !av.querySelector("img")){ av.classList.add("hasimg"); av.innerHTML=`<img src="${ph}" alt="Foto de ${esc(F.active.passenger.first)}">`; } }
    else { const reqs=[...root.querySelectorAll(".req")];
      if(reqs.length===(F.requests||[]).length) reqs.forEach((el,i)=>{ const ph=mediaSrc(F.requests[i].passenger?.photo_url), st=el.querySelector(".top strong");
        if(ph && st && !st.querySelector(".pmini")) st.insertAdjacentHTML("afterbegin",`<img class="pmini" src="${ph}" alt="">`); }); }
  }
  if(S.overlay==="admin" && S.adm?.tab==="usuarios" && Array.isArray(S.adm.users)){
    root.querySelectorAll("[data-ublock]").forEach(b=>{ const u=S.adm.users.find(x=>String(x.id)===b.dataset.ublock); const card=b.closest(".req");
      if(!u?.photo_url || !card || card.querySelector(".admph")) return;
      card.querySelector(".top")?.insertAdjacentHTML("beforebegin",`<div class="admph"><img src="${mediaSrc(u.photo_url)}" alt=""><button class="link" data-uphotodel="${u.id}" style="color:var(--bad)">Quitar foto</button></div>`); });
  }
}
const _renderPh = render;
render = function(){ _renderPh(); passengerPhotos(sheet); };

/* ================= Arranque ================= */
if(API && !SAVED.token){ SAVED.user=null; save("user"); }
if(API && SAVED.driver && !SAVED.driver.serverId){ SAVED.driver=null; save("driver"); }
if(!SAVED.user) S.overlay="regpas";
showOnboarding();
netState();
render();
hideSplash();
locate(true);
syncFromServer();
loadLeaflet().then(initMap).catch(()=>{
  $("#mapmsg").textContent="No se pudo cargar el mapa con esta conexión. Igual puedes buscar tu destino por nombre.";
  $("#locbtn").hidden=true; $("#stylebtn").hidden=true;
});
</script>
